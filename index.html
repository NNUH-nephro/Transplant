/* --------------------------------------------------------------- totals */
function tally(list) {
  const t = { complete: 0, pending: 0, todo: 0, na: 0, gatesOpen: [], total: 0 };
  list.forEach((it) => {
    if (it.group) return;
    const st = itemState(it.key);
    const s = statusOf(st);
    t[s] += 1;
    if (s !== 'na') t.total += 1;
    if (it.gate && s !== 'complete' && s !== 'na') t.gatesOpen.push(it);
  });
  t.outstanding = t.pending + t.todo;
  t.pct = t.total ? Math.round((t.complete / t.total) * 100) : 0;
  t.ready = t.total > 0 && t.outstanding === 0;
  return t;
}

/* ---------------------------------------------------------- visit logic */
function visitStatus(v, anchorISO) {
  const st = visitState(v.key);
  if (st.attended) return { code: 'attended', label: 'Attended', due: dueOf(v, anchorISO) };
  const due = dueOf(v, anchorISO);
  if (!due) return { code: 'unset', label: 'Set the date', due: null };
  const t = TODAY();
  if (t > addDays(due, v.grace)) return { code: 'overdue', label: 'OVERDUE', due };
  if (t >= addDays(due, -v.grace)) return { code: 'due', label: 'Due now', due };
  return { code: 'scheduled', label: 'Scheduled', due };
}
function dueOf(v, anchorISO) {
  const a = parseISO(anchorISO);
  return a ? addDays(a, v.offset) : null;
}

// Embeds one of the self-contained clerking forms (Recipient/Donor History &
// Examination) inline as a same-origin iframe, rather than opening it in a
// new tab/window. The form is a full standalone app with its own ids/globals
// (S, V, render, etc.), so an iframe keeps it fully isolated from the rest of
// this page instead of risking collisions if it were injected into the DOM
// directly. Each form saves its own entries (keyed by the candidate/donor
// code you type into it) to this browser's storage via its own Save button
// and "Saved on this device" list — that is independent of this app's cloud
// sync, so it stays on this device/browser unless printed or copied out.
function renderIframeFormInline(title, htmlSrc, frameId, startNote) {
  const wrap = el('div', { class: 'stack' });
  const back = el('button', { class: 'btn btn-ghost', text: '← Back' });
  back.addEventListener('click', () => { registryView = 'historymenu'; render(); });
  wrap.appendChild(back);

  const head = card(title, startNote
    ? 'Opens straight to the generated note. Pick a saved record from the list at the bottom of the note to load it.'
    : 'Fill it in below, use its own Save button to keep a copy on this device (kept by the code you enter), and Print or Copy the generated note when done.');
  const tools = el('div', { class: 'toolbar' });
  const printBtn = el('button', { class: 'btn btn-ghost', text: 'Print' });
  tools.append(printBtn);
  head.appendChild(tools);
  wrap.appendChild(head);

  const frame = document.createElement('iframe');
  frame.id = frameId;
  frame.style.cssText = 'width:100%;min-height:80vh;border:0;border-radius:10px;background:#fff;';
  frame.setAttribute('title', title);
  wrap.appendChild(frame);

  printBtn.addEventListener('click', () => {
    try { frame.contentWindow.focus(); frame.contentWindow.print(); } catch (e) { window.print(); }
  });

  if (startNote) {
    frame.addEventListener('load', () => {
      try {
        const w = frame.contentWindow;
        if (w && typeof w.render === 'function') { w.cur = '__note'; w.render(); }
      } catch (e) { /* ignore — form still usable from its own nav */ }
    });
  }

  // Set via the DOM property (not the srcdoc attribute string) so none of
  // the form's own markup needs re-escaping.
  frame.srcdoc = htmlSrc;

  return wrap;
}

  const tools = el('div', { class: 'toolbar' });

  });

    (() => { const i = el('input', { type: 'date', value: dateFrom }); i.addEventListener('change', (e) => { dateFrom = e.target.value; paintList(); }); return i; })()]);
  const toF = el('label', { class: 'field small' }, [el('span', { text: 'Opened to' }),
    (() => { const i = el('input', { type: 'date', value: dateTo }); i.addEventListener('change', (e) => { dateTo = e.target.value; paintList(); }); return i; })()]);
  tools.append(fromF, toF);

  }
  listCard.appendChild(tools);
  const listBox = el('div', { class: 'case-list', id: 'caseListBox' });
  listCard.appendChild(listBox);
  wrap.appendChild(listCard);

  function filteredCases() {
    return registryCache.filter((c) => {
      const opened = (c.opened || '').slice(0, 10);
      if (dateFrom && (!opened || opened < dateFrom)) return false;
      if (dateTo && (!opened || opened > dateTo)) return false;
      const st = c.caseStatus || 'waiting';
      if (statusFilter !== 'all' && st !== statusFilter) return false;
      return true;
    });
  }
  function paintList() {
    listBox.innerHTML = '';
    if (!cloudReady()) { listBox.appendChild(el('div', { class: 'empty-state', text: 'Configure the cloud connection to browse registered patients.' })); return; }
    if (registryLoading) { listBox.appendChild(el('div', { class: 'empty-state', text: 'Loading\u2026' })); return; }
    const rows = filteredCases();
    if (!rows.length) { listBox.appendChild(el('div', { class: 'empty-state', text: 'No registered pairs match yet.' })); return; }
    rows.forEach((c) => {
      const st = CASE_STATUS[c.caseStatus || 'waiting'];
      const name = browseWho === 'donor' ? (c.donorName || 'Unnamed donor') : (c.recipientName || 'Unnamed recipient');
      const other = browseWho === 'donor' ? (c.recipientName || 'Unnamed recipient') : (c.donorName || 'Unnamed donor');
      const validPct = (v) => (typeof v === 'number' && v >= 0 && v <= 100) ? v : 0;
      const pct = browseWho === 'donor' ? validPct(c.donorProgress) : validPct(c.recipientProgress);
      const row = el('div', { class: 'case-row', style: 'grid-template-columns:1fr auto auto auto' });
      row.appendChild(el('div', { class: 'who' }, [
        el('b', {}, [
          document.createTextNode(name + ' '),
          el('span', { class: 'ready-inline ' + (pct >= 100 ? 'ready-yes' : pct > 0 ? '' : 'ready-no'), style: pct > 0 && pct < 100 ? 'background:var(--warn-bg);color:var(--warn)' : '', text: pct + '%' }),
        ]),
        el('span', { text: `${browseWho === 'donor' ? 'Recipient' : 'Donor'}: ${other}` }),
      ]));
      row.appendChild(badge(st.badge.replace('b-', ''), st.label));
      const dateText = c.caseStatus === 'transplanted' && c.transplantDate ? 'Transplanted ' + fmt(c.transplantDate)
        : c.caseStatus === 'scheduled' && c.scheduledDate ? 'Scheduled ' + fmt(c.scheduledDate)
        : c.opened ? 'Opened ' + fmt(c.opened.slice(0, 10)) : '';
      row.appendChild(el('div', { class: 'upd', text: dateText }));
      const delBtn = el('button', { class: 'btn btn-ghost', text: '\u{1F5D1} Delete', style: 'color:var(--bad);border-color:var(--bad-bg)' });
      delBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const who = `${c.recipientName || 'Unnamed recipient'} / ${c.donorName || 'Unnamed donor'}`;
        if (!confirm(`Are you sure you want to delete ${who}? This cannot be undone \u2014 the registry row and this patient's data will be permanently removed.`)) return;
        try {
          await gasDeleteCase(c.caseId);
          registryCache = registryCache.filter((x) => x.caseId !== c.caseId);
          toast('Deleted.');
          paintList();
        } catch (err) { toast('Could not delete \u2014 ' + err.message, true); }
      });
      row.appendChild(delBtn);
      row.addEventListener('click', () => {
        if (dirty && hasCase && !confirm('Discard unsaved changes on the current case and open this one?')) return;
        openCase(c.caseId);
      });
      listBox.appendChild(row);
    });
  }
  async function loadRegistryList() {
    if (!cloudReady()) { paintList(); return; }
    registryLoading = true; paintList();
    try { registryCache = await gasListCases(registryQuery); }
    catch (e) { toast('Could not load the registry \u2014 ' + e.message, true); registryCache = []; }
    registryLoading = false; paintList();
  }
  loadRegistryList();

  return wrap;
}

function progressCard(title, t, tab) {

  ]);
  c.appendChild(el('div', { class: 'big-pct', text: t.pct + '%' }));
  c.appendChild(bar);
  const stats = el('div', { class: 'stats' });
  stats.append(
    stat('Complete', t.complete, 'ok'), stat('Pending', t.pending, 'warn'),
    stat('Not started', t.todo, 'bad'), stat('N/A', t.na, 'muted'),
  );
  c.appendChild(stats);
  c.appendChild(el('div', { class: 'ready ' + (t.ready ? 'ready-yes' : 'ready-no'),
    text: t.ready ? 'READY for Transplant Committee' : `${t.outstanding} of ${t.total} outstanding` }));
  c.appendChild(el('button', { class: 'btn btn-quiet', text: 'Open checklist →', onclick: () => { activeTab = tab; render(); } }));
  return c;
}
const pc = (n, d) => (d ? (n / d) * 100 : 0);
function stat(label, value, tone) {
  return el('div', { class: 'stat' }, [el('strong', { class: tone, text: String(value) }), el('span', { text: label })]);
}
function badge(code, label) {
  return el('span', { class: 'badge b-' + code, text: label });
}
function card(title, sub) {
  const c = el('section', { class: 'card' });
  if (title) c.appendChild(el('h2', { text: title }));
  if (sub) c.appendChild(el('p', { class: 'sub', text: sub }));

function renderChecklist(which) {
  const list = which === 'donor' ? DATA.donor : DATA.recipient;
  const t = tally(list);
  const wrap = el('div', { class: 'stack' });

  const head = el('section', { class: 'card sticky-head' });
  const nameLine = el('div', { class: 'patient-head', style: 'margin-bottom:6px' });
  const activeName = which === 'donor' ? (S.meta.donorName || 'Unnamed donor') : (S.meta.recipientName || 'Unnamed recipient');
  const otherLabel = which === 'donor' ? 'Recipient' : 'Donor';
  const otherName = which === 'donor' ? (S.meta.recipientName || 'Unnamed recipient') : (S.meta.donorName || 'Unnamed donor');
  nameLine.appendChild(el('h2', { text: `${which === 'donor' ? 'Donor' : 'Recipient'}: ${activeName}` }));
  nameLine.appendChild(el('span', { class: 'ready-inline ready-yes', text: `${otherLabel}: ${otherName}` }));
  head.appendChild(nameLine);
  head.appendChild(el('h2', { text: which === 'donor' ? 'Living kidney donor — evaluation & perioperative checklist' : 'Kidney transplant recipient — evaluation & perioperative checklist' }));
  head.appendChild(el('p', { class: 'sub', text: which === 'donor' ? 'Program Manual v2.1, Guidelines 1–3' : 'Program Manual v2.1, Guideline 4' }));

  const bar = el('div', { class: 'bar' }, [
    el('div', { class: 'seg seg-complete', style: `width:${pc(t.complete, t.total)}%` }),
    el('div', { class: 'seg seg-pending', style: `width:${pc(t.pending, t.total)}%` }),
  ]);
  head.appendChild(bar);
  head.appendChild(el('div', { class: 'inline-stats' }, [
    el('span', {}, [el('strong', { text: `${t.complete}/${t.total}` }), ' complete']),
    el('span', {}, [el('strong', { class: 'warn', text: String(t.pending) }), ' pending']),
    el('span', {}, [el('strong', { class: 'bad', text: String(t.todo) }), ' not started']),
    el('span', {}, [el('strong', { class: 'muted', text: String(t.na) }), ' N/A']),
    el('span', { class: 'ready-inline ' + (t.ready ? 'ready-yes' : 'ready-no'), text: t.ready ? 'READY' : 'NOT READY' }),
  ]));

  const tools = el('div', { class: 'toolbar' });
  const sInput = el('input', { type: 'search', placeholder: 'Search items…', value: search[which], class: 'search' });
  sInput.addEventListener('input', (e) => { search[which] = e.target.value.toLowerCase(); renderRows(); });
  tools.appendChild(sInput);
  const fgroup = el('div', { class: 'segmented' });
  [['all', 'All'], ['outstanding', 'Outstanding'], ['complete', 'Complete']].forEach(([k, lbl]) => {
    const b = el('button', { class: 'seg-btn' + (filters[which] === k ? ' on' : ''), text: lbl });
    b.addEventListener('click', () => { filters[which] = k; render(); });
    fgroup.appendChild(b);
  });
  tools.appendChild(fgroup);
  head.appendChild(tools);
  wrap.appendChild(head);

  const body = el('div', { id: 'rows' });
  wrap.appendChild(body);

  function renderRows() {
    body.innerHTML = '';
    const q = search[which];
    const mode = filters[which];
    let currentGroup = null, groupBox = null, shown = 0;
    list.forEach((it) => {
      if (it.group) { currentGroup = it.group; groupBox = null; return; }
      const st = itemState(it.key);
      const s = statusOf(st);
      if (mode === 'outstanding' && (s === 'complete' || s === 'na')) return;
      if (mode === 'complete' && s !== 'complete') return;
      if (mode === 'gates' && !it.gate) return;
      if (q && !(it.text.toLowerCase().includes(q) || it.ref.toLowerCase().includes(q) || currentGroup.toLowerCase().includes(q))) return;
      if (!groupBox) {
        groupBox = el('section', { class: 'card group' });
        groupBox.appendChild(el('h3', { class: 'group-title', text: currentGroup }));
        body.appendChild(groupBox);
      }
      groupBox.appendChild(itemRow(it, which));
      shown += 1;
    });
    if (!shown) body.appendChild(el('section', { class: 'card' }, el('p', { class: 'muted-note', text: 'No items match the current filter.' })));
  }
  renderRows();
  return wrap;
}

function itemRow(it, which) {
  const st = itemState(it.key);
  const s = statusOf(st);
  const row = el('div', { class: 'item s-' + s + (it.gate ? ' is-gate' : '') });

  const top = el('div', { class: 'item-top' });

  const cb = el('input', { type: 'checkbox', class: 'item-check', title: 'Mark complete with today\'s date' });
  cb.checked = s === 'complete';
  cb.addEventListener('change', () => {
    if (cb.checked) { st.completed = iso(TODAY()); st.na = false; if (!st.ordered) st.ordered = st.completed; }
    else { st.completed = ''; }
    markDirty(); render();
  });
  top.appendChild(cb);

  const text = el('span', { class: 'item-text' });
  if (it.gate) text.appendChild(el('span', { class: 'gate-pill', text: 'GATE' }));
  text.appendChild(document.createTextNode(it.text.replace(/^GATE — /, '')));
  top.appendChild(text);

  top.appendChild(el('span', { class: 'ref-tiny', text: '\u00a7' + it.ref }));

  const dateTiny = el('input', { type: 'date', class: 'date-tiny', title: 'Date completed', value: st.completed || '' });
  dateTiny.addEventListener('change', (e) => {
    st.completed = e.target.value;
    if (st.completed) { st.na = false; if (!st.ordered) st.ordered = st.completed; }
    markDirty(); render();
  });
  top.appendChild(dateTiny);

  const pend = el('button', { class: 'pending-tiny' + (s === 'pending' ? ' on' : ''), type: 'button', title: 'Mark as ordered / pending result', text: s === 'pending' ? '\u23f3 Pending' : 'Pending' });
  pend.addEventListener('click', () => {
    if (st.ordered && !st.completed) { st.ordered = ''; } else { st.ordered = iso(TODAY()); st.na = false; }
    markDirty(); render();
  });
  top.appendChild(pend);

  const naTiny = el('label', { class: 'na-tiny' }, [
    (() => {
      const c = el('input', { type: 'checkbox' });
      c.checked = !!st.na;
      c.addEventListener('change', (e) => {
        st.na = e.target.checked;
        if (st.na) { st.ordered = ''; st.completed = ''; }
        markDirty(); render();
      });
      return c;
    })(),
    el('span', { text: 'N/A' }),
  ]);
  top.appendChild(naTiny);

  row.appendChild(top);

  const extra = el('div', { class: 'item-extra' });
  st.values = st.values || {};
  if (it.components && it.components.length) {
    const compRow = el('div', { class: 'item-components' });
    it.components.forEach((comp) => {
      const input = el('input', { type: 'text', value: st.values[comp] || '', placeholder: comp });
      input.addEventListener('input', () => {
        st.values[comp] = input.value;
        const anyFilled = it.components.some((c) => (st.values[c] || '').trim());
        if (anyFilled && !st.completed) { st.completed = iso(TODAY()); if (!st.ordered) st.ordered = st.completed; }
        if (!anyFilled && st.completed) { st.completed = ''; }
      });
      input.addEventListener('blur', () => { markDirty(); render(); });
      compRow.appendChild(el('label', { class: 'field small' }, [el('span', { text: comp }), input]));
    });
    extra.appendChild(compRow);
  } else if (it.answerType === 'yesno') {
    const sel = el('select');
    sel.appendChild(el('option', { value: '', text: 'Not answered' }));
    sel.appendChild(el('option', { value: 'Yes', text: 'Yes' }));
    sel.appendChild(el('option', { value: 'No', text: 'No' }));
    sel.value = st.result || '';
    sel.addEventListener('change', () => {
      st.result = sel.value;
      if (sel.value && !st.completed) { st.completed = iso(TODAY()); if (!st.ordered) st.ordered = st.completed; }
      if (!sel.value && st.completed) { st.completed = ''; }
      markDirty(); render();
    });
    extra.appendChild(el('label', { class: 'field small' }, [el('span', { text: 'Answer' }), sel]));
  } else {
    const resultField = textField('Lab value / result', st, 'result');
    const resultInput = resultField.querySelector('input');
    resultInput.addEventListener('input', () => {
      if (resultInput.value.trim() && !st.completed) { st.completed = iso(TODAY()); if (!st.ordered) st.ordered = st.completed; }
      if (!resultInput.value.trim() && st.completed) { st.completed = ''; }
    });
    resultInput.addEventListener('blur', () => { markDirty(); render(); });
    extra.appendChild(resultField);
  }
  extra.appendChild(textField(st.na ? 'Reason for N/A (required)' : 'Notes', st, 'notes', st.na && !st.notes));
  row.appendChild(extra);
  return row;
}

function dateField(label, obj, key) {
  const input = el('input', { type: 'date', value: obj[key] || '' });
  input.addEventListener('change', (e) => { obj[key] = e.target.value; markDirty(); render(); });
  return el('label', { class: 'field small' }, [el('span', { text: label }), input]);
}
function textField(label, obj, key, warn) {
  const input = el('input', { type: 'text', value: obj[key] || '', class: warn ? 'warn-input' : '' });
  input.addEventListener('input', (e) => { obj[key] = e.target.value; markDirty(); });
  input.addEventListener('blur', () => { if (warn) render(); });
  return el('label', { class: 'field small grow' }, [el('span', { text: label }), input]);
}

    el('label', { class: 'field' }, [el('span', { text: isR ? 'Date of transplant' : 'Date of donor nephrectomy' }), anchor]),
  ]));

  const counts = { attended: 0, overdue: 0, due: 0, scheduled: 0 };
  list.forEach((v) => { if (!v.section) counts[visitStatus(v, S.meta[anchorKey]).code === 'unset' ? 'scheduled' : visitStatus(v, S.meta[anchorKey]).code] += 1; });
  head.appendChild(el('div', { class: 'inline-stats' }, [
    el('span', {}, [el('strong', { class: 'ok', text: String(counts.attended) }), ' attended']),

    }
    if (!box) { box = el('section', { class: 'card group' }); wrap.appendChild(box); }
    box.appendChild(visitRow(v, S.meta[anchorKey], cols));
  });
  return wrap;
}

function visitRow(v, anchorISO, cols) {
  const st = visitState(v.key);
  const s = visitStatus(v, anchorISO);
  const row = el('div', { class: 'item v-' + s.code });

  const main = el('div', { class: 'item-main' });
  main.appendChild(el('div', { class: 'item-title' }, el('span', { text: v.label })));
  main.appendChild(el('div', { class: 'item-meta' }, [
    el('span', { class: 'ref', text: 'Day ' + v.offset + ' · ± ' + v.grace + 'd' }),
    s.due ? el('span', { class: 'due', text: 'Due ' + fmt(iso(s.due)) }) : null,
    badge(s.code, s.label),
  ]));
  main.appendChild(el('div', { class: 'tests', text: v.tests }));
  row.appendChild(main);

  const ctl = el('div', { class: 'item-ctl' });
  const done = el('button', { class: 'btn btn-tick' + (st.attended ? ' on' : ''), text: st.attended ? '✓ Attended' : '✓ Attended today' });
  done.addEventListener('click', () => { st.attended = st.attended ? '' : iso(TODAY()); markDirty(); render(); });
  ctl.appendChild(done);
  ctl.appendChild(dateField('Date attended', st, 'attended'));

  const extra = el('div', { class: 'item-extra' });

    extra.appendChild(el('label', { class: 'field small' }, [el('span', { text: c }), input]));
  });
  extra.appendChild(textField('Notes', st, 'notes'));
  row.appendChild(extra);
  return row;
}

/* ------------------------------------------------------------ cloud API */
function genCaseId() {
  const slug = (s) => (s || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
  const d = slug(S.meta.donorName);
  const r = slug(S.meta.recipientName);
  if (d || r) return `${d || 'donor'}_${r || 'recip'}_${Date.now().toString(36)}`;
  return `case_${Date.now()}`;
}
async function gasCall(method, params, body) {
  if (!cloudReady()) throw new Error('Set the Google Apps Script URL in Settings first.');
  let url = CFG.gasUrl;
  if (method === 'GET') {
    const qs = new URLSearchParams(params || {});
    url += (url.includes('?') ? '&' : '?') + qs.toString();
    const res = await fetch(url);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    return data;
  }
  const res = await fetch(url, { method: 'POST', body: JSON.stringify(body) });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}
async function gasListCases(q) {
  const data = await gasCall('GET', { action: 'list', q: q || '' });
  return data.cases || [];
}
async function gasGetCase(caseId) {
  const data = await gasCall('GET', { action: 'get', caseId });
  return data.data;
}
async function gasUpsertCase(state) {
  return gasCall('POST', null, { action: 'upsert', data: state });
}
async function gasDeleteCase(caseId) {
  return gasCall('POST', null, { action: 'delete', caseId });
}
async function gasExportSheet(caseId, rows) {
  return gasCall('POST', null, { action: 'exportSheet', caseId, rows });
}

async function cloudSave(silent) {
  if (!cloudReady()) { if (!silent) toast('Add your Google Apps Script URL in Settings first.', true); return; }
  if (!S.meta.caseId) S.meta.caseId = genCaseId();
  S.meta.donorProgress = tally(DATA.donor).pct;
  S.meta.recipientProgress = tally(DATA.recipient).pct;
  syncCloudPill('busy');
  try {
    await gasUpsertCase(S);
    markClean();
    if (!silent) toast('Saved to the cloud.');
  } catch (e) {
    syncCloudPill('error');
    if (!silent) toast('Could not save to the cloud — ' + e.message, true);
  }
}
async function openCase(caseId) {
  try {
    const data = await gasGetCase(caseId);
    S = Object.assign(blankState(), data);
    S.items = data.items || {};
    S.visits = data.visits || {};
    S.intake = data.intake || {};
    hasCase = true;
    markClean();
    activeTab = 'overview';
    render();
  } catch (e) {
    toast('Could not open that case — ' + e.message, true);
  }
}
function buildExportRows() {
  const rows = [['Sheet', 'Section', '#', 'Ref', 'Item', 'Status', 'Date ordered', 'Date completed', 'Result / value', 'Notes']];
  const push = (list, sheet) => {
    let g = '', n = 0;
    list.forEach((it) => {
      if (it.group) { g = it.group; return; }
      n += 1;
      const st = itemState(it.key);
      const resultText = it.components && it.components.length
        ? it.components.map((c) => (st.values && st.values[c] ? `${c}=${st.values[c]}` : '')).filter(Boolean).join('; ')
        : st.result;
      rows.push([sheet, g, n, '§' + it.ref, it.text, STATUS_LABEL[statusOf(st)], st.ordered, st.completed, resultText, st.notes]);
    });
  };
  push(DATA.donor, 'Donor checklist');
  push(DATA.recipient, 'Recipient checklist');
  const pushV = (list, anchor, sheet, cols) => {
    let g = '';
    list.forEach((v) => {
      if (v.section) { g = v.section; return; }
      const st = visitState(v.key), s = visitStatus(v, anchor);
      rows.push([sheet, g, '', 'Day ' + v.offset, v.label, s.label, s.due ? iso(s.due) : '', st.attended,
        cols.map((c) => (st.values[c] ? c + '=' + st.values[c] : '')).filter(Boolean).join('; '), st.notes]);
    });
  };
  pushV(DATA.recipVisits, S.meta.transplantDate, 'Recipient follow-up', DATA.recipCols);
  pushV(DATA.donorVisits, S.meta.nephrectomyDate, 'Donor follow-up', DATA.donorCols);
  return rows;
}
async function exportSheetClick() {
  if (!cloudReady()) { toast('Add your Google Apps Script URL in Settings first.', true); return; }
  if (!S.meta.caseId) S.meta.caseId = genCaseId();
  toast('Exporting to Google Sheet…');
  try {
    await cloudSave(true);
    const rows = buildExportRows();
    const res = await gasExportSheet(S.meta.caseId, rows);
    toast('Exported. Open the Google Sheet to view the new tab.');
    if (res.url) window.open(res.url, '_blank');
  } catch (e) {
    toast('Export failed — ' + e.message, true);
  }
}
function outstandingItems() {
  const out = [];
  const collect = (list, sheet) => {
    let g = '';
    list.forEach((it) => {
      if (it.group) { g = it.group; return; }
      const st = itemState(it.key);
      const s = statusOf(st);
      if (s === 'pending' || s === 'todo') out.push({ sheet, group: g, text: it.text, ref: it.ref, status: STATUS_LABEL[s], gate: it.gate });
    });
  };
  collect(DATA.donor, 'Donor');
  collect(DATA.recipient, 'Recipient');
  return out;
}
function shortLabel(text) {
  let t = text.replace(/^GATE — /, '');
  const dashIdx = t.indexOf(' — ');
  if (dashIdx > -1) t = t.slice(0, dashIdx);
  const parenIdx = t.indexOf(' (');
  if (parenIdx > -1) t = t.slice(0, parenIdx);
  return t.trim();
}
function reminderBody() {
  const items = outstandingItems();
  const name = `${S.meta.recipientName || 'Recipient'} / ${S.meta.donorName || 'Donor'}`;
  if (!items.length) return `Everything is complete for ${name}.`;
  const donorItems = items.filter((i) => i.sheet === 'Donor').map((i) => shortLabel(i.text));
  const recipItems = items.filter((i) => i.sheet === 'Recipient').map((i) => shortLabel(i.text));
  const lines = [`Missing for ${name}:`, ''];
  if (donorItems.length) lines.push(`Donor: ${donorItems.join(', ')}.`);
  if (recipItems.length) lines.push(`Recipient: ${recipItems.join(', ')}.`);
  return lines.join('\n');
}
async function sendReminder() {
  const items = outstandingItems();
  if (!items.length) { toast('Nothing outstanding — no reminder needed.'); return; }
  const to = S.meta.email;
  if (!to) { toast('Add the recipient/coordinator email on the Overview tab first.', true); return; }
  if (!CFG.emailjsService || !CFG.emailjsTemplate || !CFG.emailjsPublicKey) {
    toast('Add your EmailJS Service ID, Template ID and Public Key in Settings first.', true);
    return;
  }
  try {
    emailjs.init({ publicKey: CFG.emailjsPublicKey });
    await emailjs.send(CFG.emailjsService, CFG.emailjsTemplate, {
      to_email: to,
      patient_name: `${S.meta.recipientName || 'Recipient'} / ${S.meta.donorName || 'Donor'}`,
      case_id: S.meta.caseId || genCaseId(),
      outstanding_count: String(items.length),
      message: reminderBody(),
    });
    toast(`Reminder sent to ${to}.`);
  } catch (e) {
    toast('Could not send the reminder — ' + (e.text || e.message || e), true);
  }
}

/* ------------------------------------------------------- save / load */
function saveCase() {
  S.meta.savedAt = new Date().toISOString();
  const name = (S.meta.caseId || `${S.meta.donorMrn || 'donor'}-${S.meta.recipientMrn || 'recipient'}`).replace(/[^\w.-]+/g, '_');
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
  downloadBlob(blob, `transplant-case_${name}_${iso(TODAY())}.json`);
  markClean();
}
function loadCase(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const parsed = JSON.parse(fr.result);
      if (!parsed || typeof parsed !== 'object' || !parsed.meta) throw new Error('Not a tracker case file.');
      S = Object.assign(blankState(), parsed);
      S.items = parsed.items || {};
      S.visits = parsed.visits || {};
      S.intake = parsed.intake || {};
      hasCase = true;
      markClean();
      document.querySelectorAll('.modal-back').forEach((n) => n.remove());
      activeTab = 'overview';
      render();
      toast('Case file loaded.');
    } catch (e) {
      toast('Could not read that file — ' + e.message, true);
    }
  };
  fr.readAsText(file);
}
function downloadPdf() {
  if (window.__jspdfFailed || !window.jspdf || !window.jspdf.jsPDF) {
    toast('PDF library failed to load \u2014 check your internet connection and that cdnjs.cloudflare.com isn\u2019t blocked, then reload the page.', true);
    return;
  }
  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'landscape', unit: 'pt' });
    const rows = buildExportRows();
    const head = [rows[0]];
    const body = rows.slice(1);
    const title = `${S.meta.recipientName || 'Recipient'} \u2194 ${S.meta.donorName || 'Donor'} \u2014 Transplant checklist`;
    doc.setFontSize(13);
    doc.text(title, 30, 26);
    doc.setFontSize(9);
    doc.text(`Case ${S.meta.caseId || genCaseId()} \u00b7 Generated ${iso(TODAY())}`, 30, 40);
    doc.autoTable({
      head, body, startY: 50,
      styles: { fontSize: 7, cellPadding: 3, overflow: 'linebreak' },
      headStyles: { fillColor: [31, 56, 100], textColor: 255 },
      margin: { left: 20, right: 20 },
    });
    doc.save(`transplant-checklist_${(S.meta.caseId || genCaseId()).replace(/[^\w.-]+/g, '_')}.pdf`);
  } catch (e) {
    toast('Could not generate the PDF \u2014 ' + e.message, true);
  }
}
function exportCsv() {
  const rows = [['Sheet', 'Section', '#', 'Ref', 'Item', 'Status', 'Date ordered', 'Date completed', 'Result', 'Notes']];
  const push = (list, sheet) => {
    let g = '', n = 0;
    list.forEach((it) => {
      if (it.group) { g = it.group; return; }
      n += 1;
      const st = itemState(it.key);
      rows.push([sheet, g, n, '§' + it.ref, it.text, STATUS_LABEL[statusOf(st)], st.ordered, st.completed, st.result, st.notes]);
    });
  };
  push(DATA.donor, 'Donor checklist');
  push(DATA.recipient, 'Recipient checklist');
  const pushV = (list, anchor, sheet, cols) => {
    let g = '';
    list.forEach((v) => {
      if (v.section) { g = v.section; return; }
      const st = visitState(v.key), s = visitStatus(v, anchor);
      rows.push([sheet, g, '', 'Day ' + v.offset, v.label, s.label, s.due ? iso(s.due) : '', st.attended,
        cols.map((c) => (st.values[c] ? c + '=' + st.values[c] : '')).filter(Boolean).join('; '), st.notes]);
    });
  };
  pushV(DATA.recipVisits, S.meta.transplantDate, 'Recipient follow-up', DATA.recipCols);
  pushV(DATA.donorVisits, S.meta.nephrectomyDate, 'Donor follow-up', DATA.donorCols);
  const csv = rows.map((r) => r.map((c) => {
    const v = c === undefined || c === null ? '' : String(c);
    return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }).join(',')).join('\r\n');
  downloadBlob(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }),
    `transplant-case_${(S.meta.caseId || 'export').replace(/[^\w.-]+/g, '_')}_${iso(TODAY())}.csv`);
}
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: filename });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function toast(msg, bad) {
  const t = el('div', { class: 'toast' + (bad ? ' bad' : ''), text: msg });
  document.body.appendChild(t);
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3200);
}

/* ------------------------------------------------------------- wiring */
function openSettings() {
  if (CFG.password && !appUnlocked) { openAppLockModal(openSettingsForm); return; }
  openSettingsForm();
}
function openAppLockModal(onSuccess) {
  const back = el('div', { class: 'modal-back' });
  const m = el('div', { class: 'modal' });
  m.appendChild(el('h2', { text: 'Password required' }));
  m.appendChild(el('p', { class: 'sub', text: 'Enter the password to continue.' }));
  const row = el('div', { class: 'toolbar' });
  const pwInput = pinInput();
  const go = () => {
    if (pwInput.value === CFG.password) { appUnlocked = true; back.remove(); onSuccess(); }
    else toast('Incorrect password.', true);
  };
  pwInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
  const btn = el('button', { class: 'btn', text: 'Unlock' });
  btn.addEventListener('click', go);
  row.append(pwInput, btn);
  m.appendChild(row);
  const cancel = el('button', { class: 'btn btn-ghost', text: 'Cancel', style: 'margin-top:14px' });
  cancel.addEventListener('click', () => back.remove());
  m.appendChild(cancel);
  back.appendChild(m);
  back.addEventListener('click', (e) => { if (e.target === back) back.remove(); });
  document.getElementById('modalRoot').appendChild(back);
}
function openSettingsForm() {
  const back = el('div', { class: 'modal-back' });
  const m = el('div', { class: 'modal' });
  m.appendChild(el('h2', { text: 'Settings' }));
  m.appendChild(el('p', { class: 'sub', text: 'These fields are pre-filled with the shared defaults built into this page. Changes here only affect this browser \u2014 to change what everyone gets by default, edit DEFAULT_CFG in the file itself.' }));
  const grid = el('div', { class: 'form-grid' });
  const tmp = Object.assign({}, CFG);
  const f = (label, key, ph) => {
    const input = el('input', { type: 'text', value: tmp[key] || '', placeholder: ph || '' });
    input.addEventListener('input', (e) => { tmp[key] = e.target.value; });
    return el('label', { class: 'field' }, [el('span', { text: label }), input]);
  };
  const fPin = (label, key) => {
    const input = el('input', { type: 'text', value: tmp[key] || '', placeholder: 'Password', inputmode: 'numeric', maxlength: '6' });
    input.addEventListener('input', (e) => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6); tmp[key] = e.target.value; });
    return el('label', { class: 'field' }, [el('span', { text: label }), input]);
  };
  grid.append(
    f('Google Apps Script Web App URL', 'gasUrl', 'https://script.google.com/macros/s/…/exec'),
    f('EmailJS Service ID', 'emailjsService'),
    f('EmailJS Template ID', 'emailjsTemplate'),
    f('EmailJS Public Key', 'emailjsPublicKey'),
    fPin('Password (required to enter Registry, view donors/recipients, and open Settings)', 'password'),
  );
  m.appendChild(grid);

  const settingsBackup = card('Settings backup', 'If your browser keeps losing these settings (private browsing, an in-app browser, storage getting cleared), save them to a small file and reload them in one click next time \u2014 no retyping.');
  const sbRow = el('div', { class: 'toolbar' });
  const sbSave = el('button', { class: 'btn btn-ghost', text: 'Download settings file' });
  sbSave.addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(tmp, null, 2)], { type: 'application/json' });
    downloadBlob(blob, 'tracker-settings.json');
  });
  const sbLoad = el('button', { class: 'btn btn-ghost', text: 'Load settings file' });
  const sbFile = el('input', { type: 'file', accept: 'application/json,.json', hidden: true });
  sbLoad.addEventListener('click', () => sbFile.click());
  sbFile.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const parsed = JSON.parse(fr.result);
        CFG = Object.assign(loadCfg(), parsed);
        saveCfg();
        back.remove();
        toast('Settings loaded and saved.');
        if (activeTab === 'registry') render();
      } catch (err) { toast('Could not read that settings file.', true); }
    };
    fr.readAsText(file);
  });
  sbRow.append(sbSave, sbLoad, sbFile);
  settingsBackup.appendChild(sbRow);
  m.appendChild(settingsBackup);

  const backupNote = card('Local backup (optional)', 'Save or load a plain .json copy of the currently open case, independent of the cloud.');
  const bRow = el('div', { class: 'toolbar' });
  const bSave = el('button', { class: 'btn btn-ghost', text: 'Save case file' });
  bSave.addEventListener('click', saveCase);
  const bLoad = el('button', { class: 'btn btn-ghost', text: 'Load case file' });
  const fi = document.getElementById('fileInput');
  bLoad.addEventListener('click', () => fi.click());
  bRow.append(bSave, bLoad);
  backupNote.appendChild(bRow);
  m.appendChild(backupNote);

  const actions = el('div', { class: 'modal-actions' });
  const resetBtn = el('button', { class: 'btn btn-ghost', text: 'Reset to shared defaults' });
  resetBtn.addEventListener('click', () => {
    localStorage.removeItem(CFG_KEY);
    CFG = Object.assign({}, DEFAULT_CFG);
    back.remove();
    toast('Reset to the shared defaults built into this page.');
    if (activeTab === 'registry') render();
  });
  const cancel = el('button', { class: 'btn btn-ghost', text: 'Close' });
  cancel.addEventListener('click', () => back.remove());
  const save = el('button', { class: 'btn', text: 'Save settings' });
  save.addEventListener('click', () => { CFG = tmp; saveCfg(); back.remove(); toast('Settings saved.'); if (activeTab === 'registry') render(); });
  actions.append(resetBtn, cancel, save);
  m.appendChild(actions);

  back.appendChild(m);
  back.addEventListener('click', (e) => { if (e.target === back) back.remove(); });
  document.getElementById('modalRoot').appendChild(back);
}

function init() {
  document.getElementById('btnBack').addEventListener('click', goBack);
  document.getElementById('btnHome').addEventListener('click', () => { activeTab = 'registry'; registryView = 'home'; render(); });
  document.getElementById('btnSwitch').addEventListener('click', () => { activeTab = 'registry'; registryView = 'browse'; render(); });
  document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => {
    activeTab = t.dataset.tab;
    if (activeTab === 'registry') { registryView = 'home'; }
    render();
  }));
  document.getElementById('btnRemind').addEventListener('click', sendReminder);
  document.getElementById('btnSettings').addEventListener('click', openSettings);
  document.getElementById('btnExportSheet').addEventListener('click', exportSheetClick);
  document.getElementById('btnPdf').addEventListener('click', downloadPdf);
  document.getElementById('btnCsv').addEventListener('click', exportCsv);
  document.getElementById('btnPrint').addEventListener('click', () => window.print());
  const fi = document.getElementById('fileInput');
  fi.addEventListener('change', (e) => { if (e.target.files[0]) loadCase(e.target.files[0]); e.target.value = ''; });
  window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
  markClean();
  render();
}
document.addEventListener('DOMContentLoaded', init);

</script>
