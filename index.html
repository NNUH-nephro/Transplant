pacing:0; text-transform:none; font-weight:600}\n.sheet.rtl .hdr{text-align:right}\n.sheet.rtl .meta{text-align:left}\nmain[dir=\"rtl\"] .oitem{text-align:right}\nmain[dir=\"rtl\"] .ghead{font-family:\"IBM Plex Sans\",sans-serif; font-size:12.5px; letter-spacing:0; text-transform:none; font-weight:600}\nmain[dir=\"rtl\"] .otext{font-size:14.5px; line-height:1.8}\nmain[dir=\"rtl\"] .freelab{text-align:right}\n.arnote{margin-top:10px; font-size:12.5px; color:var(--ink-3); max-width:80ch; line-height:1.5}\n.disclaimer{border:1px dashed var(--line-2); border-radius:var(--r); padding:14px 16px; font-size:12.5px; color:var(--ink-2); background:var(--surface-2); margin-top:20px; max-width:80ch}\n.toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(10px); opacity:0; background:var(--ink); color:var(--bg);\n  padding:9px 16px; border-radius:999px; font-size:13px; pointer-events:none; transition:opacity .2s, transform .2s; z-index:80}\n.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}\n@media (prefers-reduced-motion: reduce){*{transition:none !important}}\n@media (max-width:900px){\n  .wrap{grid-template-columns:minmax(0,1fr); gap:16px}\n  nav.rail{position:static; flex-direction:row; overflow-x:auto; gap:6px; padding-bottom:6px}\n  .rail-h{display:none}\n  .rlink{width:auto; white-space:nowrap; background:var(--surface-2); border-color:var(--line)}\n  .sheet{padding:20px 16px}\n}\n@media print{\n  header.top, nav.rail, .navbtns, .toast, .disclaimer{display:none !important}\n  body{background:#fff; color:#000}\n  .wrap{display:block; padding:0; max-width:none}\n  .sheet{border:none; box-shadow:none; padding:0; max-width:none; background:#fff}\n}\n</style>\n\n<header class=\"top\">\n  <div class=\"top-in\">\n    <div class=\"brand\">\n      <h1>Peri-transplant Order Sets</h1>\n      <div class=\"sub\">NNUH Kidney Transplant Program Manual 2026 &middot; recipient and donor</div>\n    </div>\n  </div>\n</header>\n<div class=\"wrap\"><nav class=\"rail\" id=\"rail\"></nav><main id=\"main\"></main></div>\n<div class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\"></div>\n\n<script>\n\"use strict\";\nvar V={};                 // context values\nvar OFF={};               // itemKey -> true when unticked (default is ticked)\nvar ON={};                // itemKey -> true when ticked for default-off items\nvar cur=\"radm\";\n\nfunction el(t,c,x){ var e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e; }\nfunction toast(m){ var t=document.getElementById(\"toast\"); t.textContent=m; t.classList.add(\"show\");\n  clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove(\"show\");},1900); }\nfunction num(id){ var x=parseFloat(V[id]); return isNaN(x)?null:x; }\nfunction wt(){ return num(\"weight\"); }\nfunction r1(x){ return Math.round(x*10)/10; }\nfunction tacDose(){ var w=wt(); if(!w) return null; return (Math.round(w*0.05*2)/2).toFixed(1); }\nfunction atgDose(){ var w=wt(); if(!w) return null; return r1(w*1.5); }\nfunction predDose(){ var w=wt(); if(!w) return null; return Math.round(w); }\nfunction predLadder(){\n  var seq=[], x=80;\n  while(x>20){ seq.push(x); x-=10; }\n  seq.push(20);\n  return seq;\n}\nfunction cefaz(){ var w=wt(); return (w&&w>120)?\"3 g\":\"2 g\"; }\nfunction valgan(){\n  var c=num(\"crcl\");\n  if(c==null) return {d:\"dose by creatinine clearance\", warn:true};\n  if(c>=60) return {d:\"900 mg once daily\"};\n  if(c>=40) return {d:\"450 mg once daily\"};\n  if(c>=25) return {d:\"450 mg every 48 hours\"};\n  if(c>=10) return {d:\"450 mg twice weekly\"};\n  return {d:\"not recommended — use IV ganciclovir, dosed after dialysis\", warn:true};\n}\nfunction isHigh(){ return V.risk===\"High\" || V.risk===\"Very high\"; }\nfunction cmvProph(){\n  if(V.cmv===\"D+ / R−\") return {months:6, txt:\"6 months\", grp:\"D+ / R− — the highest-risk pairing\"};\n  if(V.cmv===\"D+ / R+\") return {months:3, txt:\"3 months\", grp:\"D+ / R+\"};\n  if(V.cmv===\"D− / R+\") return {months:3, txt:\"3 months\", grp:\"D− / R+\", pre:true};\n  return null;\n}\nvar VALGAN_LADDER=\"Renal dose adjustment (G7.4.1) — CrCl 60 or above: 900 mg once daily. 40–59: 450 mg once daily. 25–39: 450 mg every 48 hours. 10–24: 450 mg twice weekly. Below 10 or on dialysis: not recommended — use IV ganciclovir dosed after dialysis. Recalculate at every dose review and after any creatinine change of 25% or more; full doses during delayed graft function cause profound neutropenia.\";\n\n/* ============================ order sets ============================ */\nvar SETS=[\n{id:\"radm\", grp:\"Recipient\", nm:\"Admission — day of surgery\", ttl:\"Recipient admission orders, day of surgery\",\n intro:\"Written on admission to the transplant ICU for a living-donor transplant. Doses compute from the weight and risk category entered here.\",\n ctx:[\"weight\",\"risk\",\"cmv\"],\n groups:[\n  {h:\"Admission and verification\", items:[\n   {t:\"Admit to the transplant unit ICU under Transplant Nephrology\", n:\"The recipient is in the transplant ICU both before and after surgery. Transplant surgery and urology co-manage the operative care; nephrology is the admitting and responsible service.\"},\n   {t:\"Confirm identity with two identifiers; confirm signed consent for transplantation\"},\n   {t:\"Verify Transplant Committee and Ministry of Health clearance documented in the chart\", r:\"4.2\"},\n   {t:\"Confirm the negative crossmatch result is documented in the chart\", n:\"Verifying the documented result — not repeating the test.\", r:\"4.2\"},\n   {f:function(){ return \"Record the immunological risk category assigned by the Transplant Committee\"+(V.risk?\" — \"+V.risk.toLowerCase()+\" risk\":\"\"); }, r:\"G5.2\"},\n   {t:\"Very high risk: apheresis is not available on site, so a desensitisation pathway cannot be delivered here — the Transplant Committee decides on referral elsewhere or an alternative donor before a date is fixed\", r:\"local\", w:function(){ return V.risk===\"Very high\"; }}\n  ]},\n  {h:\"Preparation\", items:[\n   {t:\"Nil by mouth from 8 hours before surgery, except prescribed oral medication taken with a sip of water\", n:\"Immunosuppressants are never omitted for a fasting patient — arrange an intravenous or nasogastric route if oral is not possible.\", r:\"local, G5.8\"},\n   {t:\"Weigh the patient and record the dry weight\"},\n   {t:\"Dialysis within 24 hours of surgery; confirm potassium below 5.5 mmol/L and euvolaemia before theatre\", r:\"local\"},\n   {t:\"Establish venous access; avoid the fistula arm for cannulation and blood pressure cuffs\", r:\"local\"},\n   {t:\"Shower with antiseptic; do not shave the operative site — clip if needed\", r:\"local\", d:false},\n   {t:\"WHO surgical safety checklist and formal time-out in theatre\", r:\"4.2\"}\n  ]},\n  {h:\"Investigations on admission\", items:[\n   {t:\"Renal profile, CBC, magnesium, calcium, phosphate, glucose, AST, ALT, albumin and coagulation screen\"},\n   {t:\"Blood group and antibody screen; group and hold two units\"},\n   {f:function(){ return \"Leucodepleted\"+(V.cmv===\"D− / R−\"?\" and CMV-seronegative\":\"\")+\" blood products if transfusion is required\"; }, r:\"G7.4\"},\n   {t:\"Urinalysis — treat an active urinary infection before surgery\", r:\"G7.5\"},\n   {t:\"ECG and chest radiograph\"},\n   {t:\"Confirm CMV and EBV IgG documented for both donor and recipient\", r:\"G7.4\"}\n  ]},\n  {h:\"Induction immunosuppression\", items:[\n   {f:function(){ return \"Methylprednisolone 500 mg IV intra-operatively, before graft reperfusion\"; }, r:\"G5.3\"},\n   {f:function(){ return \"Basiliximab 20 mg IV on day 0, within 2 hours before reperfusion\"; }, r:\"G5.3\", w:function(){ return !isHigh(); }},\n   {f:function(){ var d=atgDose(); return \"Rabbit anti-thymocyte globulin \"+(d?d+\" mg\":\"1.5 mg/kg\")+\" IV in 250 mL sodium chloride 0.9% over 6–8 hours through a central line — first dose intra-operatively before reperfusion\"; },\n    n:\"Premedicate with methylprednisolone, paracetamol and an antihistamine. Daily CBC: halve the dose if WBC 2.0–3.0 ×10⁹/L or platelets 50–75 ×10⁹/L; withhold if WBC below 2.0 or platelets below 50.\", r:\"G5.3\", w:isHigh},\n   {f:function(){ var d=tacDose(); return \"Tacrolimus (immediate-release) \"+(d?d+\" mg\":\"0.05 mg/kg\")+\" orally twice daily, starting pre-operatively or on the first post-operative day\"; },\n    n:\"Reduce in the elderly, low body weight, hepatic impairment or known CYP3A5 non-expression. Do not exceed 0.05 mg/kg twice daily without a documented prescriber decision.\", r:\"G5.4.1\"},\n   {t:\"Mycophenolate mofetil 1000 mg orally twice daily (or mycophenolate sodium 720 mg twice daily)\", r:\"G5.4.2\"},\n   {t:\"Document contraception counselling for mycophenolate before the first dose\", r:\"G5.4.2\"},\n   {rx:true, id:\"is_rx_radm\", l:\"Immunosuppression as prescribed — drug, dose and frequency\"}\n  ]},\n  {h:\"Other medication\", items:[\n   {f:function(){ return \"Cefazolin \"+cefaz()+\" IV as a single dose within 60 minutes of skin incision — one further intra-operative dose only if surgery exceeds 4 hours or blood loss exceeds 1500 mL\"; }, r:\"G7.2\"},\n   {free:true, id:\"meds_radm\", l:\"Regular and pre-operative medication\", ph:\"Prescribe the patient's own medication here — what continues, what is withheld this morning, and anything added.\"},\n   {t:\"Venous thromboembolism risk assessment; mechanical prophylaxis, with pharmacological prophylaxis as prescribed\", r:\"local\"},\n   {t:\"Analgesia: paracetamol and tramadol (Tramal) only — no NSAIDs at any point, and no other opioid\", r:\"G5.6 · local\"},\n   {t:\"Proton pump inhibitor while on high-dose steroid\", r:\"G5.4.3\"}\n  ]}\n ]},\n\n{id:\"ricu\", grp:\"Recipient\", nm:\"Post-transplant ICU\", ttl:\"Recipient post-transplant ICU orders\",\n intro:\"Care in the transplant unit ICU from reperfusion to discharge — the recipient is not transferred to a ward. Fluid replacement and haemodynamic targets are the local defaults — confirm them against your ICU practice.\",\n ctx:[\"weight\",\"risk\",\"cmv\",\"crcl\"],\n groups:[\n  {h:\"Monitoring\", items:[\n   {t:\"Admit to the transplant unit ICU under Transplant Nephrology; continuous ECG, pulse oximetry and non-invasive or arterial blood pressure\"},\n   {t:\"Hourly vital signs and hourly urine output for the whole ICU stay\", r:\"4.2\"},\n   {f:function(){ var w=wt(); return \"Call the transplant team immediately for urine output below 0.5 mL/kg/h\"+(w?\" (under \"+r1(w*0.5)+\" mL/h)\":\"\")+\", or a fall of more than 50% over 2 hours\"; }, r:\"local\"},\n   {t:\"Strict fluid balance chart — urine output measured and recorded every hour, totalled each shift, with input and output balanced hourly while replacement is running\", n:\"Hourly recording continues for the whole admission — the recipient stays in the same ICU bed until discharge.\", r:\"4.2\"},\n   {t:\"Daily weight at the same time each morning\", r:\"4.2\"},\n   {t:\"Central venous pressure target 8–12 mmHg, or dynamic volume assessment per ICU practice\", r:\"local\"},\n   {t:\"Mean arterial pressure at or above 80 mmHg to maintain graft perfusion; avoid systolic below 110 mmHg\", r:\"local\"},\n   {t:\"Urgent graft Doppler ultrasound for oliguria, a rising creatinine or graft pain\", r:\"G6.3\"},\n   {t:\"Allograft ultrasound with Doppler before discharge\", r:\"G8.3\"}\n  ]},\n  {h:\"Fluids and electrolytes\", items:[\n   {t:\"Replace the previous hour's urine output millilitre for millilitre with sodium chloride 0.45%, plus maintenance\", r:\"local\",\n    n:\"Reduce replacement to 75% once output exceeds 300 mL/h and the patient is euvolaemic. Add dextrose if the sodium rises.\"},\n   {free:true, id:\"fluid_rx\", l:\"Fluid prescription — type, rate and replacement ratio\", ph:\"e.g. sodium chloride 0.45% at 80 mL/h plus urine output mL-for-mL; change to 5% dextrose if sodium above 148. Write the prescription as you want it run.\"},\n   {t:\"Check potassium, magnesium, calcium and phosphate every 6 hours on the first day; replace to keep potassium 3.5–5.0 mmol/L and magnesium above 1.7 mg/dL\", r:\"local\"},\n   {t:\"Blood glucose every 4 hours while on high-dose steroid; insulin sliding scale if above 180 mg/dL\", r:\"local\"},\n   {t:\"No potassium-containing fluids while the graft output is establishing\", r:\"local\", d:false}\n  ]},\n  {h:\"Immunosuppression\", items:[\n   {t:\"Day 1: methylprednisolone 250 mg IV\", r:\"G5.4.3\"},\n   {t:\"Day 2: prednisone 80 mg orally, then continue orally\", r:\"local\"},\n   {f:function(){ var L=predLadder();\n      return \"From day 3: reduce prednisone by 10 mg each day down to 20 mg daily, and no lower\"+(L?\" — \"+L.join(\" → \")+\" mg\":\"\"); },\n    n:\"20 mg daily is the floor for this admission; the discharge dose is not less than 20 mg daily.\", r:\"local\"},\n   {t:\"Basiliximab 20 mg IV on day 4\", r:\"G5.3\", w:function(){ return !isHigh(); }},\n   {f:function(){ var d=atgDose(); return \"Anti-thymocyte globulin \"+(d?d+\" mg\":\"1.5 mg/kg\")+\" IV daily to complete 3–5 days (cumulative 4.5–6 mg/kg), with daily CBC and dose modification\"; }, r:\"G5.3\", w:isHigh},\n   {f:function(){ var d=tacDose(); return \"Tacrolimus \"+(d?d+\" mg\":\"0.05 mg/kg\")+\" orally twice daily; nasogastric route if not swallowing — never omit for fasting\"; }, r:\"G5.4.1, G5.8\"},\n   {f:function(){ return \"Tacrolimus trough every other day for the first week, drawn 12 hours after the dose — target 8–12 ng/mL\"+(isHigh()?\" (upper end of the range for this risk category)\":\"\")+\"; lower end if there is delayed graft function or infection\"; }, r:\"G5.4.1\"},\n   {t:\"Mycophenolate mofetil 1000 mg twice daily; withhold and discuss with the transplant pharmacist if WBC falls below 2.0 ×10⁹/L\", r:\"G5.4.2\"},\n   {rx:true, id:\"is_rx_ricu\", l:\"Immunosuppression as prescribed — drug, dose and frequency\"}\n  ]},\n  {h:\"Anti-infective prophylaxis\", items:[\n   {t:\"Co-trimoxazole 80/400 mg orally once daily once tolerating oral intake — for at least 6 months, preferably 12\", r:\"G7.3\",\n    n:\"Check creatinine and potassium after starting; trimethoprim causes a reversible creatinine rise and hyperkalaemia.\"},\n   {f:function(){ var c=cmvProph(), v=valgan();\n      if(!V.cmv) return \"Valganciclovir prophylaxis — select the CMV donor/recipient serostatus above to set the dose and duration\";\n      if(!c) return \"CMV D− / R−: no valganciclovir prophylaxis. Acyclovir 400 mg orally twice daily for 30 days, and leucodepleted or CMV-seronegative blood products\";\n      return \"Valganciclovir \"+v.d+\" for \"+c.txt+\" (\"+c.grp+\")\"+(isHigh()?\" — extend to at least 3 months after depleting induction in a seropositive recipient, 6 months in D+/R−\":\"\"); },\n    n:function(){ var c=cmvProph(); if(!c) return null;\n      return VALGAN_LADDER+(c.pre?\" The protocol's pre-emptive alternative needs weekly quantitative PCR for 12 weeks, which is not currently available here — universal prophylaxis is therefore the only workable strategy.\":\"\"); },\n    r:\"G7.4, G7.4.1\"},\n   {rx:true, id:\"cmv_rx\", l:\"CMV prophylaxis as prescribed — drug, dose and frequency\"},\n   {t:\"Acyclovir 400 mg orally twice daily for 1–3 months — only where valganciclovir is not being given\", r:\"G7.5\",\n    w:function(){ return !cmvProph(); }},\n   {t:\"Nystatin suspension 500,000 units four times daily for 1–3 months\", r:\"G7.5\"},\n   {t:\"CMV PCR while an inpatient only if a compatible clinical syndrome develops\", r:\"G7.4 · local\", d:false}\n  ]},\n  {h:\"Surgical and nursing care\", items:[\n   {t:\"Urinary catheter to free drainage; record the planned removal day\", r:\"local\"},\n   {t:\"Ureteric stent in situ — record the insertion date and book removal at 2–4 weeks\", r:\"G7.2\"},\n   {t:\"Wound and drain inspection each shift; record drain volumes\", r:\"G3.4.2\"},\n   {t:\"Paracetamol 1 g four times daily, regular\", r:\"local\"},\n   {t:\"Tramadol (Tramal) 50–100 mg every 6–8 hours as required for breakthrough pain, maximum 400 mg daily\", n:\"Extend to every 12 hours and cap at 200 mg daily where graft function is poor. No other opioid. No NSAIDs at any time.\", r:\"local\"},\n   {t:\"Venous thromboembolism prophylaxis; mechanical until mobile\", r:\"local\"},\n   {t:\"Early mobilisation and incentive spirometry as soon as safe\", r:\"4.2\"},\n   {t:\"Strict hand hygiene; remove lines and the catheter at the earliest safe opportunity\", r:\"4.2\"}\n  ]},\n  {h:\"Laboratory\", items:[\n   {t:\"Daily renal profile, CBC, magnesium, calcium, phosphate and glucose\", r:\"4.2\"},\n   {t:\"Twice-daily creatinine for the first 48 hours, or while the graft output is establishing\", r:\"local\", d:false},\n   {t:\"Daily CBC during anti-thymocyte globulin, with the dose rules in Guideline 5\", r:\"G5.3\", w:isHigh},\n   {t:\"Investigate any unexplained rise in creatinine of 20–25% above baseline, confirmed on repeat within 24 hours\", r:\"G6.2\"}\n  ]}\n ]},\n\n{id:\"rprog\", grp:\"Recipient\", nm:\"Daily progress note\", ttl:\"Daily post-transplant progress note\", type:\"note\",\n intro:\"A structured daily entry for the post-transplant round in the transplant ICU. It writes itself into a note at the end.\",\n fields:[\n  {k:\"h\", l:\"Identification\"},\n  {k:\"t\", id:\"code\", l:\"Recipient code\", w:\"m\"},\n  {k:\"t\", id:\"date\", l:\"Date\", w:\"m\", type:\"date\"},\n  {k:\"n\", id:\"pod\", l:\"Post-operative day\", w:\"s\"},\n  {k:\"t\", id:\"risk2\", l:\"Immunological risk\", w:\"m\"},\n  {k:\"h\", l:\"Overnight\"},\n  {k:\"c\", id:\"events\", l:\"Events\", multi:true, o:[\"Uneventful\",\"Fever\",\"Hypotension\",\"Oliguria\",\"Bleeding\",\"Pain poorly controlled\",\"Arrhythmia\",\"Hyperkalaemia\",\"Returned to theatre\"]},\n  {k:\"t\", id:\"uo\", l:\"Urine output (24 h)\", w:\"m\", ph:\"mL\"},\n  {k:\"t\", id:\"balance\", l:\"Fluid balance\", w:\"m\", ph:\"+/− mL\"},\n  {k:\"t\", id:\"weight2\", l:\"Weight today\", w:\"s\", ph:\"kg\"},\n  {k:\"t\", id:\"bp\", l:\"Blood pressure\", w:\"m\"},\n  {k:\"t\", id:\"temp\", l:\"Temperature\", w:\"s\", ph:\"°C\"},\n  {k:\"h\", l:\"Laboratory\"},\n  {k:\"t\", id:\"creat\", l:\"Creatinine\", w:\"s\"},\n  {k:\"t\", id:\"creatprev\", l:\"Previous creatinine\", w:\"s\"},\n  {k:\"t\", id:\"k\", l:\"Potassium\", w:\"s\"},\n  {k:\"t\", id:\"mg\", l:\"Magnesium\", w:\"s\"},\n  {k:\"t\", id:\"hb\", l:\"Haemoglobin\", w:\"s\"},\n  {k:\"t\", id:\"wbc\", l:\"White cells\", w:\"s\"},\n  {k:\"t\", id:\"plt\", l:\"Platelets\", w:\"s\"},\n  {k:\"t\", id:\"tac\", l:\"Tacrolimus trough\", w:\"s\", ph:\"ng/mL\"},\n  {k:\"t\", id:\"tactarget\", l:\"Target range\", w:\"m\", ph:\"e.g. 8–12\"},\n  {k:\"h\", l:\"Examination\"},\n  {k:\"c\", id:\"exgen\", l:\"General\", multi:true, o:[\"Comfortable\",\"Unwell\",\"Drowsy\",\"Febrile\",\"Pale\",\"Jaundiced\"]},\n  {k:\"c\", id:\"excvs\", l:\"Cardiovascular\", multi:true, o:[\"Heart sounds normal, no murmur\",\"Murmur\",\"Irregular pulse\",\"Tachycardic\",\"Hypotensive\",\"Hypertensive\",\"Peripheral pulses present\",\"Cool peripheries\"]},\n  {k:\"c\", id:\"exresp\", l:\"Respiratory\", multi:true, o:[\"Chest clear\",\"Basal crackles\",\"Widespread crackles\",\"Reduced air entry\",\"Wheeze\",\"Tachypnoeic\",\"On oxygen\",\"Pleural effusion suspected\"]},\n  {k:\"c\", id:\"exvol\", l:\"Volume status\", multi:true, o:[\"Euvolaemic\",\"Hypovolaemic\",\"Fluid overloaded\",\"JVP normal\",\"JVP raised\",\"JVP low\",\"Peripheral oedema\",\"Postural drop\",\"Above dry weight\",\"Below dry weight\"]},\n  {k:\"c\", id:\"exabd\", l:\"Abdomen and graft\", multi:true, o:[\"Soft, non-tender\",\"Distended\",\"Graft non-tender\",\"Graft tender\",\"Graft swelling\",\"Bowel sounds present\",\"Ileus\",\"Wound clean and dry\",\"Wound discharge\",\"Drain draining clear\",\"Drain draining blood-stained\"]},\n  {k:\"h\", l:\"Lines and drains\"},\n  {k:\"c\", id:\"lines\", l:\"In situ / removed\", multi:true, o:[\"Urinary catheter in situ\",\"Catheter removed\",\"Drain in situ\",\"Drain removed\",\"Central line in situ\",\"Central line removed\",\"Ureteric stent in situ\"]},\n  {k:\"h\", l:\"Assessment and plan\"},\n  {k:\"c\", id:\"graft\", l:\"Graft function\", o:[\"Immediate function, creatinine falling\",\"Slow graft function\",\"Delayed graft function — dialysis required\",\"Plateau in creatinine\",\"Rising creatinine\"]},\n  {k:\"a\", id:\"impression\", l:\"Impression\", ph:\"One or two lines: where this patient is and what is driving today's decisions.\"},\n  {k:\"c\", id:\"plan\", l:\"Plan\", multi:true, o:[\"Continue current immunosuppression\",\"Adjust tacrolimus dose\",\"Repeat trough tomorrow\",\"Doppler ultrasound\",\"Consider biopsy\",\"Reduce fluid replacement\",\"Start oral intake\",\"Mobilise\",\"Remove catheter\",\"Remove drain\",\"Book stent removal\",\"Step down monitoring frequency\",\"Plan discharge\",\"Discharge today\"]},\n  {k:\"a\", id:\"plantext\", l:\"Plan detail\", ph:\"Anything the list does not capture, and who is doing it.\"},\n  {k:\"t\", id:\"signed\", l:\"Reviewed by\", w:\"m\"}\n ]},\n\n{id:\"rdis\", grp:\"Recipient\", nm:\"Discharge\", ttl:\"Recipient discharge orders and instructions\",\n intro:\"The discharge set: medication, prophylaxis with durations, the follow-up schedule and the education the patient must be able to repeat back.\",\n ctx:[\"weight\",\"risk\",\"cmv\",\"crcl\"],\n groups:[\n  {h:\"Discharge criteria\", items:[\n   {t:\"Creatinine falling or stable; urine output satisfactory\"},\n   {t:\"Tolerating oral intake and oral medication\"},\n   {t:\"Pain controlled on oral analgesia\"},\n   {t:\"Wound satisfactory; no evidence of infection or leak\"},\n   {t:\"Allograft Doppler ultrasound performed before discharge\", r:\"G8.3\"},\n   {t:\"Patient can state medication names, doses and times without prompting\", r:\"4.2\"}\n  ]},\n  {h:\"Immunosuppression on discharge\", items:[\n   {f:function(){ var d=tacDose(); return \"Tacrolimus — current dose, taken at the same two times each day, 12 hours apart\"+(d?\" (started at \"+d+\" mg twice daily)\":\"\"); }, r:\"G5.4.1\"},\n   {f:function(){ return \"Tacrolimus target for this period: 8–12 ng/mL to month 1, then 8–10 to month 3, 6–8 to month 6, 5–8 to month 12\"; }, r:\"G5.4.1\"},\n   {t:\"Levels drawn 12 hours after the previous dose, before the morning dose, at a consistent time\", r:\"G5.4.1\"},\n   {t:\"Mycophenolate mofetil 1000 mg twice daily\", r:\"G5.4.2\"},\n   {t:\"Prednisone on discharge — not less than 20 mg daily\", r:\"local\"},\n   {t:\"After discharge, taper by 5 mg weekly to a maintenance of 5 mg daily by month 3\", r:\"G5.4.3\"},\n   {t:\"Written medication card in Arabic and English, listing names, doses, times and the level-monitoring plan\", r:\"G5.8\"},\n   {t:\"Missed dose rule: if under 4 hours late, take it; if more than 4 hours, skip it and take the next dose at the usual time. Never double a dose.\", r:\"G5.8\"},\n   {t:\"Confirm at least one month's supply of every immunosuppressant in hand before discharge\", r:\"local\"},\n   {rx:true, id:\"is_rx_rdis\", l:\"Discharge immunosuppression — drug, dose and frequency\"}\n  ]},\n  {h:\"Prophylaxis\", items:[\n   {t:\"Co-trimoxazole 80/400 mg daily — continue to at least 6 months, preferably 12\", r:\"G7.3\"},\n   {f:function(){ var c=cmvProph(), v=valgan();\n      if(!V.cmv) return \"Valganciclovir — select the CMV serostatus above to set the dose and duration\";\n      return c ? \"Valganciclovir \"+v.d+\" for \"+c.txt+\" from transplant (\"+c.grp+\"), with the dose recalculated as graft function changes\"\n               : \"No CMV prophylaxis (D− / R−); acyclovir 400 mg twice daily for 30 days\"; },\n    n:function(){ return cmvProph()? VALGAN_LADDER : null; }, r:\"G7.4, G7.4.1\"},\n   {rx:true, id:\"cmv_rx_dis\", l:\"CMV prophylaxis as prescribed — drug, dose and frequency\"},\n   {free:true, id:\"cmv_stop\", l:\"Prophylaxis stop date\", ph:\"Date valganciclovir is due to stop, and the date CMV PCR surveillance begins.\"},\n   {t:\"Warn the patient and the team that late CMV disease appears in the three months after prophylaxis stops — test at the first fever, cytopenia or unexplained rise in creatinine\", n:\"Routine PCR every 1–2 weeks after prophylaxis is the protocol standard but is not currently affordable, so detection depends on a low threshold for testing.\", r:\"G7.4 · local\", w:function(){ return V.cmv===\"D+ / R−\"; }},\n   {t:\"CMV PCR every 1–2 weeks for 3 months after prophylaxis stops, where testing is available\", r:\"G7.4\", w:function(){ return V.cmv===\"D+ / R−\"; }, d:false},\n   {t:\"CBC weekly for the first month then monthly while on valganciclovir\", r:\"G7.4\", w:function(){ return !!cmvProph(); }},\n   {t:\"Nystatin suspension 500,000 units four times daily to complete 1–3 months\", r:\"G7.5\"},\n   {t:\"Proton pump inhibitor, calcium and vitamin D while on steroid\", r:\"G5.4.3\"}\n  ]},\n  {h:\"Appointments and surveillance\", items:[\n   {t:\"Transplant clinic two to three times weekly for the first four weeks\", r:\"G8.2\"},\n   {t:\"Each visit: creatinine, electrolytes, magnesium, CBC, glucose, tacrolimus trough, weight, blood pressure, wound and stent check\", r:\"G8.2\"},\n   {date:true, id:\"appt_next\", l:\"Next clinic appointment\", n:\"Weeks 1–4 are two to three times weekly — book the first visit before the patient leaves, not afterwards.\"},\n   {date:true, id:\"appt_labs\", l:\"Date of the next laboratory tests\", n:\"Creatinine, electrolytes, magnesium, CBC, glucose and tacrolimus trough, drawn 12 hours after the previous dose.\"},\n   {t:\"Ureteric stent removal booked at 2–4 weeks — date recorded in the chart and given to the patient\", r:\"G7.2\"},\n   {date:true, id:\"appt_stent\", l:\"Stent removal appointment\"},\n   {t:\"CMV and BK virus PCR when clinically indicated — with any unexplained rise in creatinine, cytopenia or fever\", n:\"Monthly BK and CMV surveillance is the protocol standard but is not currently affordable; testing is therefore driven by the clinical picture.\", r:\"G8.3 · local\"},\n   {t:\"Protocol surveillance when resources allow: BK PCR monthly to month 6, CMV PCR per the serostatus strategy, donor-specific antibody at 3, 6 and 12 months\", r:\"G8.3\", d:false},\n   {f:function(){ return \"Donor-specific antibody at least 3-monthly through the first year for this risk category — not currently available on cost grounds; record the gap and reassess the plan if testing becomes possible\"; }, r:\"G8.3 · local\", w:isHigh, d:false},\n   {t:\"Entered on the follow-up register; coordinator to track attendance\", r:\"G8.2\"}\n  ]},\n  {h:\"Patient education before discharge\", items:[\n   {t:\"Record daily weight, blood pressure, temperature and urine output for the first three months\", r:\"G8.7\"},\n   {t:\"Contact the unit immediately for: temperature above 38 °C, a marked fall in urine output, graft pain or swelling, weight gain over 2 kg in 2 days, vomiting or diarrhoea preventing medication, a missed or vomited dose, breathlessness or chest pain, blood in the urine or wound discharge\", r:\"G8.7\"},\n   {t:\"Never start an antibiotic elsewhere without contacting the transplant team\", r:\"G7.9\"},\n   {t:\"Permanently avoid NSAIDs, grapefruit, pomelo, Seville orange and St John's wort\", r:\"G5.6\"},\n   {t:\"Food and water safety: no unpasteurised dairy, undercooked meat or eggs, raw shellfish or unwashed produce\", r:\"G7.9\"},\n   {t:\"Avoid crowds and people with respiratory infection for the first three months; gloves for gardening; no cleaning of animal litter or bird cages\", r:\"G7.9\"},\n   {t:\"Daily sun protection; annual skin examination\", r:\"G7.9\"},\n   {t:\"Inactivated vaccines resume at 3 months; no live vaccines ever; household contacts should be vaccinated\", r:\"G7.8\"},\n   {t:\"Contraception counselling documented for mycophenolate; pregnancy deferred at least 1–2 years and planned with the team\", r:\"G5.4.2, G8.4\"},\n   {t:\"Discuss Ramadan fasting and any planned travel in advance so dosing can be adjusted safely\", r:\"G5.8\"},\n   {t:\"Written 24-hour emergency contact details for the transplant unit\", r:\"G8.7\"}\n  ]}\n ]},\n\n{id:\"dpre\", grp:\"Donor\", nm:\"Pre-operative\", ttl:\"Donor pre-operative orders\",\n intro:\"The morning of donor nephrectomy. Every item here exists to protect a healthy person having an operation they do not need.\",\n ctx:[\"weight\"],\n groups:[\n  {h:\"Verification\", items:[\n   {t:\"Confirm donor identity with two identifiers; confirm consent and eligibility\", r:\"G3.2.1\"},\n   {t:\"Verify all three approvals documented: Ethics Committee, Multidisciplinary Transplant Committee, Ministry of Health Transplant Committee\", r:\"G3.2.1\"},\n   {t:\"Re-check the documented blood group and negative crossmatch with the recipient\", n:\"Verifying the recorded result before theatre.\", r:\"G3.2.1\"},\n   {t:\"Surgical and anaesthetic assessments complete and documented\", r:\"G3.2.2\"},\n   {t:\"Consent re-verified with the donor personally on the day of surgery\", r:\"G3.2.2\"},\n   {t:\"Remind the donor that withdrawal remains possible up to induction, and record that this was done\", r:\"G3.2.2\"},\n   {t:\"Offer emotional and psychological support\", r:\"G3.2.2\"},\n   {t:\"CT angiogram displayed in theatre; operative side independently confirmed against it by two staff members\", r:\"G3.2.2\"},\n   {t:\"WHO surgical safety checklist and formal time-out — identity, procedure, correct side, correct kidney\", r:\"G3.2.2\"}\n  ]},\n  {h:\"Preparation\", items:[\n   {t:\"Nil by mouth from at least 8 hours before surgery, except prescribed oral medication taken with a sip of water\", n:\"The manual's G3.2.1 permits clear fluids until 2 hours before induction; this set follows local practice instead.\", r:\"local\"},\n   {t:\"Bowel preparation only if specified by the operating surgeon\", r:\"G3.2.1\"},\n   {t:\"Establish venous access and commence intravenous hydration\", r:\"G3.2.1\"},\n   {t:\"Venous thromboembolism risk assessment; mechanical prophylaxis, pharmacological as prescribed\", r:\"G3.2.1\"},\n   {t:\"Baseline laboratory tests: CBC, creatinine, electrolytes, coagulation, group and save\", r:\"G3.2.1\"},\n   {t:\"No NSAIDs — permanently, for donors\", r:\"G3.5.1\"}\n  ]},\n  {h:\"Medication\", items:[\n   {f:function(){ return \"Cefazolin \"+cefaz()+\" IV as a single dose within 60 minutes of skin incision — one further intra-operative dose only if surgery exceeds 4 hours or blood loss exceeds 1500 mL\"; }, r:\"G7.2\"},\n   {t:\"Multimodal analgesia initiated intra-operatively; regional block where appropriate\", r:\"G3.3.2\"},\n   {t:\"Maintain normothermia, normovolaemia and adequate mean arterial pressure to preserve renal perfusion\", r:\"G3.3.2\"},\n   {t:\"Avoid all nephrotoxic agents, including NSAIDs and aminoglycosides\", r:\"G3.3.2\"}\n  ]}\n ]},\n\n{id:\"dpost\", grp:\"Donor\", nm:\"Post-operative\", ttl:\"Donor post-operative orders\",\n intro:\"Recovery after nephrectomy. The escalation thresholds are the ones that catch bleeding early.\",\n ctx:[\"weight\"],\n groups:[\n  {h:\"Recovery unit\", items:[\n   {t:\"Monitor vital signs, oxygen saturation, urine output, pain score and wound or drain bleeding\", r:\"G3.4.1\"},\n   {f:function(){ var w=wt(); return \"Escalate immediately for hypotension, tachycardia, a falling haemoglobin, or urine output below 0.5 mL/kg/h\"+(w?\" (under \"+r1(w*0.5)+\" mL/h)\":\"\"); }, r:\"G3.4.1\"},\n   {t:\"Assess for anaesthesia-related complications before discharge from recovery\", r:\"G3.4.1\"}\n  ]},\n  {h:\"Ward care\", items:[\n   {t:\"Maintain intravenous hydration; introduce oral intake as tolerated\", r:\"G3.4.2\"},\n   {t:\"Encourage ambulation within 6–12 hours of surgery\", r:\"G3.4.2\"},\n   {t:\"Incentive spirometry hourly while awake\", r:\"G3.4.2\"},\n   {t:\"Inspect the surgical site and record drainage volumes each shift\", r:\"G3.4.2\"},\n   {t:\"Continue venous thromboembolism prophylaxis until fully mobile\", r:\"G3.4.2\"},\n   {t:\"Urinary catheter removed once mobile, unless otherwise indicated\", r:\"local\"},\n   {t:\"Dressing care with strict hand hygiene; document wound assessment daily\", r:\"G3.4.3\"}\n  ]},\n  {h:\"Analgesia\", items:[\n   {t:\"Pain score on a standard numeric scale at least every 4 hours\", r:\"G3.4.3\"},\n   {t:\"Paracetamol 1 g four times daily, regular\", r:\"local\"},\n   {t:\"Tramadol (Tramal) 50–100 mg every 6–8 hours as required for breakthrough pain, maximum 400 mg daily, with an aperient\", n:\"No other opioid. Reduce the frequency if renal function is slow to settle after nephrectomy.\", r:\"local\"},\n   {t:\"No NSAIDs — not now, and not after discharge; no opioid other than tramadol\", r:\"G3.4.2 · local\"}\n  ]},\n  {h:\"Laboratory and antibiotics\", items:[\n   {t:\"Daily CBC, serum creatinine and electrolytes until stable and improving\", r:\"G3.4.2\"},\n   {t:\"Report any fall in haemoglobin of more than 2 g/dL to the surgical team\", r:\"local\"}\n  ]}\n ]},\n\n{id:\"ddis\", grp:\"Donor\", nm:\"Discharge\", ttl:\"Donor discharge orders and instructions\",\n intro:\"Discharge criteria from Guideline 3, and the lifelong follow-up commitment that starts here.\",\n ctx:[],\n groups:[\n  {h:\"Discharge criteria — all must be met\", items:[\n   {t:\"Haemodynamically stable: normal vital signs, no evidence of ongoing bleeding, stable haemoglobin\", r:\"G3.5\"},\n   {t:\"Tolerating oral intake without nausea or vomiting\", r:\"G3.5\"},\n   {t:\"Ambulating independently; bladder and bowel function returned\", r:\"G3.5\"},\n   {t:\"Pain controlled on oral analgesia alone\", r:\"G3.5\"},\n   {t:\"Serum creatinine stable or falling; adequate urine output\", r:\"G3.5\"},\n   {t:\"Wound satisfactory — no infection, dehiscence or significant drainage\", r:\"G3.5\"},\n   {t:\"Donor and family able to describe wound care, warning signs and the follow-up plan\", r:\"G3.5\"}\n  ]},\n  {h:\"Instructions given\", items:[\n   {t:\"Wound care, and the specific signs of infection that require urgent review\", r:\"G3.5.1\"},\n   {t:\"Analgesia plan, with a clear instruction to avoid NSAIDs permanently\", r:\"G3.5.1\"},\n   {t:\"No heavy lifting or strenuous activity for 4–6 weeks\", r:\"G3.5.1\"},\n   {t:\"Driving only when pain-free and able to perform an emergency stop\", r:\"G3.5.1\"},\n   {t:\"Maintain good hydration; avoid contact sports\", r:\"G3.5.1\"},\n   {t:\"Inform any future treating doctor of the single-kidney status\", r:\"G3.5.1\"},\n   {t:\"Keep blood pressure and weight in the normal range\", r:\"G8.6\"},\n   {t:\"Pregnancy after donation is generally safe but carries a modestly increased risk of gestational hypertension and pre-eclampsia, and warrants closer obstetric monitoring\", r:\"G8.6\", d:false},\n   {t:\"Written 24-hour emergency contact details for the transplant unit\", r:\"G3.5.1\"}\n  ]},\n  {h:\"Follow-up\", items:[\n   {t:\"First review 3–7 days after discharge: wound review, pain, return of function — with creatinine, CBC and electrolytes\", r:\"G8.6\"},\n   {date:true, id:\"dappt_next\", l:\"First review appointment\", n:\"Booked before the donor leaves, with the laboratory tests requested in advance.\"},\n   {t:\"1 month: recovery and return-to-work planning, psychological wellbeing — creatinine and eGFR, urinalysis, blood pressure\", r:\"G8.6\"},\n   {t:\"3 months: full clinical review — creatinine and eGFR, urine protein-to-creatinine ratio, blood pressure, weight\", r:\"G8.6\"},\n   {t:\"6 months: creatinine and eGFR, urinalysis, blood pressure\", r:\"G8.6\"},\n   {t:\"12 months: comprehensive review — creatinine and eGFR, protein-to-creatinine ratio, fasting glucose, lipids, blood pressure, BMI\", r:\"G8.6\"},\n   {t:\"Annual lifelong health check thereafter; donor entered on the donor register with recall reminders\", r:\"G8.6\"},\n   {t:\"Any hypertension, proteinuria or reduced eGFR is referred promptly to nephrology\", r:\"G8.6\"},\n   {t:\"Discharge summary with medication list, restrictions and follow-up plan, copied to the donor\", r:\"G3.7\"}\n  ]}\n ]},\n\n{id:\"arrec\", grp:\"Patient sheets\", nm:\"Recipient instructions (Arabic)\", ttl:\"تعليمات المريض بعد زراعة الكلى\", rtl:true,\n intro:\"A discharge instruction sheet for the recipient, in Arabic. Untick anything that does not apply, add your own lines at the end, then print or download it for the patient.\",\n ctx:[],\n groups:[\n  {h:\"الأدوية\", items:[\n   {t:\"تناول أدويتك المثبطة للمناعة كل يوم في نفس الموعد تماماً، ولا توقفها أبداً من تلقاء نفسك.\"},\n   {t:\"دواء البروغراف (تاكروليمس) يؤخذ كل ١٢ ساعة، صباحاً ومساءً، في نفس الساعة كل يوم.\"},\n   {t:\"في يوم فحص مستوى الدواء في الدم: لا تأخذ جرعة الصباح قبل سحب العينة، وخذها مباشرة بعد السحب.\"},\n   {t:\"إذا نسيت جرعة: إذا مرّ أقل من ٤ ساعات خذها فوراً، وإذا مرّ أكثر من ٤ ساعات تجاوزها وخذ الجرعة التالية في موعدها. لا تضاعف الجرعة أبداً.\"},\n   {t:\"إذا تقيأت بعد الجرعة بأقل من نصف ساعة، أو أصابك إسهال شديد، اتصل بوحدة الزراعة في نفس اليوم — قد لا يكون الدواء قد امتص.\"},\n   {t:\"احتفظ دائماً بمخزون من الأدوية يكفي شهراً على الأقل، ولا تنتظر حتى تنفد.\"},\n   {t:\"ممنوع تماماً: مسكنات الألم من نوع مضادات الالتهاب غير الستيرويدية مثل الآيبوبروفين والديكلوفيناك (فولتارين). استعمل الباراسيتامول فقط.\"},\n   {t:\"ممنوع: الجريب فروت والبوملي والبرتقال المر وعشبة سانت جون — تغيّر مستوى الدواء في الدم بشكل خطير.\"},\n   {t:\"لا تبدأ أي دواء جديد، بما في ذلك الأعشاب والمكملات والمضادات الحيوية، قبل استشارة فريق الزراعة.\"},\n   {t:\"احمل معك دائماً بطاقة الأدوية، وأظهرها لأي طبيب أو صيدلي تراجعه.\"}\n  ]},\n  {h:\"المتابعة اليومية في البيت\", items:[\n   {t:\"سجّل كل يوم: الوزن، وضغط الدم، ودرجة الحرارة، وكمية البول، خلال الأشهر الثلاثة الأولى.\"},\n   {t:\"اشرب الماء بكمية كافية حسب تعليمات الطبيب، ولا تقلل السوائل من تلقاء نفسك.\"},\n   {t:\"زن نفسك في نفس الوقت كل صباح، بعد التبول وقبل الإفطار.\"},\n   {t:\"أحضر سجل القياسات معك في كل زيارة للعيادة.\"}\n  ]},\n  {h:\"اتصل بنا فوراً إذا حدث\", items:[\n   {t:\"ارتفاع الحرارة فوق ٣٨ درجة، أو قشعريرة ورجفة.\"},\n   {t:\"نقص واضح في كمية البول.\"},\n   {t:\"ألم أو تورم أو احمرار فوق مكان الكلية المزروعة.\"},\n   {t:\"زيادة في الوزن أكثر من كيلوغرامين خلال يومين، أو انتفاخ جديد.\"},\n   {t:\"قيء أو إسهال يمنعك من أخذ الأدوية.\"},\n   {t:\"ضيق نفس جديد، أو سعال، أو ألم في الصدر.\"},\n   {t:\"دم في البول، أو حرقة عند التبول، أو إفرازات من الجرح.\"},\n   {t:\"لا تنتظر موعد العيادة، ولا تبدأ مضاداً حيوياً بنفسك — اتصل بنا أولاً.\"}\n  ]},\n  {h:\"الوقاية من العدوى\", items:[\n   {t:\"اغسل يديك كثيراً، خاصة قبل الأكل وبعد الخروج من البيت.\"},\n   {t:\"تجنب الأماكن المزدحمة والأشخاص المصابين بالرشح أو السعال خلال الأشهر الثلاثة الأولى.\"},\n   {t:\"تجنب الحليب ومنتجات الألبان غير المبسترة، واللحوم والبيض غير المطهوة جيداً، والمأكولات البحرية النيئة، والخضار والفواكه غير المغسولة.\"},\n   {t:\"اشرب ماءً نظيفاً، وتجنب السباحة في المياه غير المعالجة في الفترة الأولى.\"},\n   {t:\"استعمل القفازات عند العمل في التراب أو الحديقة، وتجنب تنظيف أقفاص الطيور وفضلات الحيوانات.\"},\n   {t:\"احمِ جلدك من الشمس كل يوم، واستعمل واقي الشمس، وافحص جلدك سنوياً.\"},\n   {t:\"اللقاحات الحية ممنوعة نهائياً بعد الزراعة. اللقاحات غير الحية تستأنف بعد ثلاثة أشهر بإذن الفريق. ويُنصح بتطعيم أفراد الأسرة.\"}\n  ]},\n  {h:\"المواعيد والمتابعة\", items:[\n   {t:\"العيادة مرتين إلى ثلاث مرات أسبوعياً خلال الشهر الأول، ثم حسب جدول المتابعة.\"},\n   {t:\"لا تفوّت موعداً. إذا تعذّر الحضور، اتصل بنا لتحديد موعد بديل في أقرب وقت.\"},\n   {t:\"احضر إلى العيادة صائماً عن جرعة الصباح من البروغراف، وخذها بعد سحب الدم.\"},\n   {t:\"موعد إزالة الدعامة (الستنت) محدد في تاريخه — لا تتأخر عنه، فبقاؤها يسبب التهاباً وحصوات.\"},\n   {t:\"أخبرنا مسبقاً قبل السفر أو قبل الصيام في رمضان حتى نعدّل مواعيد الأدوية بأمان.\"}\n  ]},\n  {h:\"أمور مهمة أخرى\", items:[\n   {t:\"للنساء: الحمل مؤجل سنة إلى سنتين على الأقل بعد الزراعة، ويجب التخطيط له مع الفريق. دواء الميكوفينولات يسبب تشوهات للجنين ويجب إيقافه وتبديله قبل الحمل بستة أسابيع على الأقل.\"},\n   {t:\"للرجال والنساء: استعمل وسيلة منع حمل فعالة طوال فترة العلاج بالميكوفينولات.\"},\n   {t:\"راجع طبيب الأسنان بانتظام، وأخبره دائماً أنك مزروع كلية.\"},\n   {t:\"لا تدخّن، وتجنب التدخين السلبي.\"},\n   {t:\"عد إلى نشاطك تدريجياً، وتجنب رفع الأثقال خلال الأسابيع الأولى حسب تعليمات الجراح.\"}\n  ]},\n  {h:\"أرقام التواصل\", items:[\n   {free:true, id:\"ar_contact_rec\", l:\"رقم الطوارئ ووحدة الزراعة\", ph:\"اكتب هنا رقم الهاتف المتاح ٢٤ ساعة، واسم منسق الزراعة.\"},\n   {free:true, id:\"ar_extra_rec\", l:\"تعليمات إضافية لهذا المريض\", ph:\"أي تعليمات خاصة بهذه الحالة.\"}\n  ]}\n ]},\n\n{id:\"ardon\", grp:\"Patient sheets\", nm:\"Donor instructions (Arabic)\", ttl:\"تعليمات المتبرع بعد التبرع بالكلى\", rtl:true,\n intro:\"A discharge instruction sheet for the living donor, in Arabic. Same idea — untick what does not apply, then print it for them.\",\n ctx:[],\n groups:[\n  {h:\"العناية بالجرح\", items:[\n   {t:\"حافظ على الجرح نظيفاً وجافاً، وغيّر الضماد حسب التعليمات.\"},\n   {t:\"يمكنك الاستحمام بعد السماح لك بذلك، مع تجفيف الجرح جيداً بعده.\"},\n   {t:\"راجعنا فوراً إذا ظهر احمرار أو تورم أو سخونة حول الجرح، أو خرجت منه إفرازات أو صديد، أو انفتح الجرح.\"}\n  ]},\n  {h:\"الألم والأدوية\", items:[\n   {t:\"الباراسيتامول هو المسكن الأساسي، ويمكن استعمال الترامال عند الحاجة حسب الوصفة.\"},\n   {t:\"ممنوع نهائياً وإلى الأبد: مضادات الالتهاب غير الستيرويدية مثل الآيبوبروفين والديكلوفيناك (فولتارين) — فهي تضر الكلية المتبقية.\"},\n   {t:\"استشر الطبيب قبل أخذ أي دواء جديد، وأخبر أي طبيب يعالجك أنك متبرع بكلية.\"}\n  ]},\n  {h:\"النشاط والعودة إلى العمل\", items:[\n   {t:\"لا ترفع أوزاناً ثقيلة ولا تبذل مجهوداً شاقاً لمدة أربعة إلى ستة أسابيع.\"},\n   {t:\"امشِ يومياً من اليوم الأول، وزد النشاط تدريجياً.\"},\n   {t:\"لا تقد السيارة حتى يزول الألم وتستطيع الضغط على المكابح بشكل مفاجئ دون ألم.\"},\n   {t:\"العودة إلى العمل حسب طبيعة عملك وتوصية الجراح.\"},\n   {t:\"تجنب الرياضات الاحتكاكية بشكل دائم.\"}\n  ]},\n  {h:\"اتصل بنا فوراً إذا حدث\", items:[\n   {t:\"ارتفاع الحرارة فوق ٣٨ درجة.\"},\n   {t:\"ألم شديد لا يزول بالمسكنات.\"},\n   {t:\"نزف من الجرح، أو تورم متزايد.\"},\n   {t:\"نقص واضح في كمية البول، أو دم في البول، أو حرقة عند التبول.\"},\n   {t:\"ضيق نفس، أو ألم في الصدر، أو تورم وألم في الساق.\"},\n   {t:\"غثيان وقيء مستمر يمنعك من الأكل والشرب.\"}\n  ]},\n  {h:\"المتابعة مدى الحياة\", items:[\n   {t:\"أول مراجعة بعد ثلاثة إلى سبعة أيام من الخروج، مع فحص الكرياتينين وتعداد الدم والأملاح.\"},\n   {t:\"ثم بعد شهر، وثلاثة أشهر، وستة أشهر، وسنة.\"},\n   {t:\"بعدها فحص سنوي مدى الحياة: وظائف الكلى، وفحص البروتين في البول، وضغط الدم، والوزن، والسكر.\"},\n   {t:\"المتابعة مسؤولية البرنامج وليست مسؤوليتك وحدك — سنتصل بك للتذكير، وإذا لم يصلك اتصال فبادر أنت.\"}\n  ]},\n  {h:\"نصائح دائمة\", items:[\n   {t:\"اشرب كمية كافية من الماء يومياً.\"},\n   {t:\"حافظ على ضغط الدم والوزن ضمن الحدود الطبيعية، وراجع الطبيب إذا ارتفع الضغط.\"},\n   {t:\"لا تدخّن.\"},\n   {t:\"أخبر أي طبيب أو مستشفى تراجعه أنك تعيش بكلية واحدة.\"},\n   {t:\"للنساء: الحمل بعد التبرع آمن عموماً، لكنه يحتاج متابعة أوثق بسبب احتمال ارتفاع الضغط وتسمم الحمل — أخبري طبيب النساء أنك متبرعة.\"}\n  ]},\n  {h:\"أرقام التواصل\", items:[\n   {free:true, id:\"ar_contact_don\", l:\"رقم الطوارئ ووحدة الزراعة\", ph:\"اكتب هنا رقم الهاتف المتاح ٢٤ ساعة، واسم منسق الزراعة.\"},\n   {free:true, id:\"ar_extra_don\", l:\"تعليمات إضافية لهذا المتبرع\", ph:\"أي تعليمات خاصة بهذه الحالة.\"}\n  ]}\n ]}\n];\n\n/* ============================ rendering ============================ */\n\nvar DRUGS=[\"Prograf (tacrolimus)\",\"Prednisone\",\"Mycophenolate mofetil\",\"Mycophenolate sodium\",\"Methylprednisolone\",\"Basiliximab (Simulect)\",\"Anti-thymocyte globulin\",\"Azathioprine\",\"Cyclosporine\",\"Valganciclovir\",\"Ganciclovir IV\",\"Letermovir\",\"Acyclovir\",\"Co-trimoxazole\",\"Nystatin suspension\"];\nvar FREQS=[\"once daily\",\"twice daily\",\"three times daily const ORIGINAL_QUESTIONNAIRE_HTML = "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<title>Pre-Transplant Evaluation Questionnaire</title>\n<style>\n  :root {\n    --line: #2c3e6b;\n    --text: #1a1a1a;\n    --muted: #555;\n    --bg-section: #f5f6fa;\n  }\n  * { box-sizing: border-box; }\n  body {\n    font-family: \"Segoe UI\", Arial, sans-serif;\n    color: var(--text);\n    max-width: 880px;\n    margin: 0 auto;\n    padding: 32px 24px 60px;\n    line-height: 1.5;\n    font-size: 14px;\n  }\n  h1 {\n    text-align: center;\n    font-size: 22px;\n    color: var(--line);\n    margin-bottom: 2px;\n  }\n  h2.subtitle {\n    text-align: center;\n    font-weight: 400;\n    font-size: 15px;\n    color: var(--muted);\n    margin-top: 0;\n    margin-bottom: 24px;\n  }\n  .top-fields {\n    display: flex;\n    flex-wrap: wrap;\n    gap: 12px 24px;\n    border: 1px solid var(--line);\n    border-radius: 6px;\n    padding: 14px 16px;\n    margin-bottom: 20px;\n    background: var(--bg-section);\n  }\n  .top-fields .field { flex: 1 1 200px; }\n  .field label { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 3px; }\n  .field .line { border-bottom: 1px solid #888; height: 20px; }\n  section {\n    border: 1px solid #ccc;\n    border-radius: 6px;\n    padding: 16px 18px;\n    margin-bottom: 18px;\n  }\n  section h3 {\n    margin: 0 0 12px;\n    font-size: 15.5px;\n    color: var(--line);\n    border-bottom: 2px solid var(--line);\n    padding-bottom: 4px;\n  }\n  .row {\n    display: flex;\n    flex-wrap: wrap;\n    gap: 8px 28px;\n    margin-bottom: 10px;\n    align-items: baseline;\n  }\n  .q { margin-bottom: 10px; }\n  .q .prompt { margin-right: 10px; }\n  .opts { display: inline-flex; gap: 16px; flex-wrap: wrap; }\n  .opt { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }\n  input.box[type=\"checkbox\"] {\n    width: 16px; height: 16px;\n    border: 1.5px solid #444;\n    border-radius: 3px;\n    flex: none;\n    accent-color: var(--line);\n    cursor: pointer;\n    margin: 0;\n  }\n  input.box[type=\"checkbox\"]:checked {\n    outline: 2px solid var(--line);\n    outline-offset: 1px;\n  }\n  input[type=\"text\"].fill-line,\n  input[type=\"text\"].line-input,\n  input[type=\"text\"].cell-input {\n    font-family: inherit;\n    font-size: 13.5px;\n    color: var(--text);\n    background: transparent;\n    border: none;\n    border-bottom: 1px solid #888;\n    outline: none;\n    padding: 2px 2px;\n  }\n  input[type=\"text\"].fill-line:focus,\n  input[type=\"text\"].line-input:focus,\n  input[type=\"text\"].cell-input:focus {\n    border-bottom: 1.5px solid var(--line);\n    background: #eef1fb;\n  }\n  input[type=\"text\"].fill-line {\n    min-width: 140px;\n    height: 20px;\n    vertical-align: bottom;\n  }\n  input[type=\"text\"].fill-line.short { min-width: 70px; }\n  input[type=\"text\"].fill-line.long { min-width: 260px; }\n  input[type=\"text\"].line-input {\n    width: 100%;\n    height: 22px;\n  }\n  input[type=\"text\"].cell-input {\n    width: 100%;\n    height: 20px;\n    border-bottom: none;\n  }\n  input[type=\"text\"].cell-input:focus { background: #eef1fb; border-bottom: none; }\n  table {\n    width: 100%;\n    border-collapse: collapse;\n    margin-top: 8px;\n  }\n  table th, table td {\n    border: 1px solid #bbb;\n    padding: 6px 8px;\n    font-size: 13px;\n    text-align: left;\n    height: 26px;\n  }\n  table th { background: var(--bg-section); }\n  .note {\n    font-style: italic;\n    color: var(--muted);\n    font-size: 12.5px;\n    margin-top: 6px;\n  }\n  .grid2 {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 6px 24px;\n  }\n  .grid3 {\n    display: grid;\n    grid-template-columns: 1fr 1fr 1fr;\n    gap: 6px 24px;\n  }\n  .signature-block {\n    margin-top: 30px;\n    display: flex;\n    justify-content: space-between;\n    gap: 40px;\n  }\n  .signature-block .sig { flex: 1; }\n  .signature-block .sig .fill-line.long { width: 100%; min-width: 0; }\n  @media print {\n    section { break-inside: avoid; }\n    input[type=\"text\"] { border-bottom: 1px solid #888 !important; background: transparent !important; }\n    input.box[type=\"checkbox\"] { -webkit-print-color-adjust: exact; print-color-adjust: exact; }\n    .no-print { display: none; }\n  }\n  .toolbar {\n    display: flex;\n    justify-content: flex-end;\n    gap: 10px;\n    margin-bottom: 12px;\n  }\n  .toolbar button {\n    font-family: inherit;\n    font-size: 13px;\n    padding: 7px 14px;\n    border-radius: 5px;\n    border: 1px solid var(--line);\n    background: var(--line);\n    color: #fff;\n    cursor: pointer;\n  }\n  .toolbar button.secondary {\n    background: #fff;\n    color: var(--line);\n  }\n</style>\n</head>\n<body>\n\n<div class=\"toolbar no-print\">\n  <button type=\"button\" class=\"secondary\" onclick=\"if(confirm('Clear all entered data on this form?')){document.querySelectorAll('input[type=text]').forEach(i=>i.value='');document.querySelectorAll('input[type=checkbox]').forEach(i=>i.checked=false);}\">Clear form</button>\n  <button type=\"button\" onclick=\"window.print()\">Print / Save as PDF</button>\n</div>\n\n<h1>Kidney/Pancreas Transplant Program</h1>\n<h2 class=\"subtitle\">Pre-Transplant Evaluation \u2014 Evaluation Questionnaire</h2>\n\n<div class=\"top-fields\">\n  <div class=\"field\"><label>Evaluation Date</label><input type=\"text\" class=\"line-input\"></div>\n  <div class=\"field\"><label>Name (Last, First, Middle)</label><input type=\"text\" class=\"line-input\"></div>\n  <div class=\"field\"><label>National ID / MRN</label><input type=\"text\" class=\"line-input\"></div>\n  <div class=\"field\"><label>Height (cm)</label><input type=\"text\" class=\"line-input\"></div>\n  <div class=\"field\"><label>Weight (kg)</label><input type=\"text\" class=\"line-input\"></div>\n  <div class=\"field\"><label>BP</label><input type=\"text\" class=\"line-input\"></div>\n  <div class=\"field\"><label>Pulse</label><input type=\"text\" class=\"line-input\"></div>\n  <div class=\"field\"><label>Respirations</label><input type=\"text\" class=\"line-input\"></div>\n  <div class=\"field\"><label>Temp.</label><input type=\"text\" class=\"line-input\"></div>\n</div>\n\n<!-- DEMOGRAPHICS -->\n<section>\n  <h3>Patient Demographics / Information</h3>\n\n  <div class=\"q\">\n    <span class=\"prompt\"><strong>Gender:</strong></span>\n    <span class=\"opts\">\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Male</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Female</span>\n    </span>\n  </div>\n\n  <div class=\"q\">\n    <span class=\"prompt\"><strong>Governorate / Place of residence:</strong></span>\n    <input type=\"text\" class=\"fill-line long\">\n  </div>\n\n  <div class=\"q\">\n    <span class=\"prompt\"><strong>Marital Status:</strong></span>\n    <span class=\"opts\">\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Single</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Married</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Separated</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Divorced</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Widowed</span>\n    </span>\n  </div>\n  <div class=\"row\">\n    <span>Number of Children: <input type=\"text\" class=\"fill-line short\"></span>\n    <span>Ages of Children: <input type=\"text\" class=\"fill-line\"></span>\n  </div>\n\n  <div class=\"q\">\n    <span class=\"prompt\"><strong>Highest Education Level:</strong></span>\n    <span class=\"opts\">\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Unknown</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> None</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Grade school</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> High school</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Attended college/technical school</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Associate's/Bachelor's degree</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Post-graduate degree</span>\n    </span>\n  </div>\n\n  <div class=\"q\">\n    <span class=\"prompt\"><strong>Employment Status (&gt;18 years old):</strong></span>\n    <div class=\"grid2\" style=\"margin-top:6px;\">\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Working full time (or student)</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Not working by choice</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Working part time by choice</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Not working, disability</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Working part time, disability</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Not working, unable to find employment</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Working part time, reason unknown</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Not working, retired</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Unknown</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Not working, reason unknown</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> N/A, &lt;19 years old</span>\n    </div>\n  </div>\n  <div class=\"row\">\n    <span>Occupation: <input type=\"text\" class=\"fill-line\"></span>\n    <span>Previous occupation: <input type=\"text\" class=\"fill-line\"></span>\n  </div>\n\n  <div class=\"q\">\n    <span class=\"prompt\"><strong>Tobacco use:</strong></span>\n    <span class=\"opts\">\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Not assessed</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Never smoked</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Currently smokes</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Quit &lt;1 year ago</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Quit &gt;1 year ago</span>\n    </span>\n    <div style=\"margin-top:6px;\"><input type=\"text\" class=\"fill-line short\"> packs per day for <input type=\"text\" class=\"fill-line short\"> years</div>\n  </div>\n\n  <div class=\"q\">\n    <span class=\"prompt\"><strong>Alcohol use:</strong></span>\n    <span class=\"opts\">\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Not assessed</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Never consumed alcohol</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Social use only</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Heavy use</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Quit &lt;6 months ago</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Quit 6\u201312 months ago</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Quit &gt;12 months ago</span>\n    </span>\n  </div>\n\n  <div class=\"q\">\n    <span class=\"prompt\"><strong>Illegal drug use:</strong></span>\n    <div class=\"grid2\" style=\"margin-top:6px;\">\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Not assessed</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Current user</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Never used illegal drugs</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Experimentation in past only</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Past regular user, quit &lt;1 year ago</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Past regular user, quit &gt;1 year ago</span>\n    </div>\n    <div class=\"row\" style=\"margin-top:6px;\">\n      <span><input type=\"checkbox\" class=\"box\" style=\"width:11px;height:11px;\"> Marijuana</span>\n      <span><input type=\"checkbox\" class=\"box\" style=\"width:11px;height:11px;\"> Narcotics</span>\n      <span><input type=\"checkbox\" class=\"box\" style=\"width:11px;height:11px;\"> IV drugs of any form</span>\n      <span>Other \u2014 specify: <input type=\"text\" class=\"fill-line\"></span>\n    </div>\n  </div>\n\n  <div class=\"q\">\n    <span class=\"prompt\"><strong>Projected sources of payment</strong></span> <span class=\"note\">(enter 1 for primary source, 2 for secondary source)</span>\n    <div class=\"grid3\" style=\"margin-top:6px;\">\n      <span><input type=\"text\" class=\"fill-line short\"> Government health insurance</span>\n      <span><input type=\"text\" class=\"fill-line short\"> Private insurance</span>\n      <span><input type=\"text\" class=\"fill-line short\"> Self-pay</span>\n      <span><input type=\"text\" class=\"fill-line short\"> UNRWA / relief agency</span>\n      <span><input type=\"text\" class=\"fill-line short\"> Donation / charitable coverage</span>\n      <span><input type=\"text\" class=\"fill-line short\"> Indigent / free care</span>\n      <span><input type=\"text\" class=\"fill-line short\"> Other: <input type=\"text\" class=\"fill-line\"></span>\n    </div>\n    <div class=\"q\" style=\"margin-top:8px;\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Medication coverage</span></div>\n  </div>\n</section>\n\n<!-- KIDNEY HISTORY -->\n<section>\n  <h3>1. Kidney History</h3>\n  <div class=\"q\">\n    <span class=\"prompt\">Have you ever had a kidney biopsy?</span>\n    <span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Yes</span></span>\n  </div>\n  <div class=\"row\">\n    <span>If yes, date of most recent biopsy: <input type=\"text\" class=\"fill-line short\"> / <input type=\"text\" class=\"fill-line short\"> / <input type=\"text\" class=\"fill-line short\"></span>\n    <span>Hospital where biopsy was performed: <input type=\"text\" class=\"fill-line\"></span>\n  </div>\n  <div class=\"q\">Dialysis start date: <input type=\"text\" class=\"fill-line short\"> / <input type=\"text\" class=\"fill-line short\"> / <input type=\"text\" class=\"fill-line short\"></div>\n  <div class=\"q\">\n    <span class=\"prompt\">First dialysis method:</span>\n    <span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Hemodialysis</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Peritoneal dialysis</span></span>\n  </div>\n  <div class=\"q\">\n    <span class=\"prompt\">Current dialysis method:</span>\n    <span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Hemodialysis</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Peritoneal dialysis</span></span>\n  </div>\n  <div class=\"q\">\n    <span class=\"prompt\">Problems with multiple dialysis access (catheter, fistula, graft, etc.)?</span>\n    <span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Yes</span></span>\n  </div>\n  <div class=\"q\">\n    <span class=\"prompt\">Problems with clotting in dialysis access (catheter, fistula, graft, etc.)?</span>\n    <span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Yes</span></span>\n  </div>\n  <div class=\"q\">\n    <span class=\"prompt\">Dialysis days:</span>\n    <span class=\"opts\">\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> M, W, F</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> T, Th, S</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Daily</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Other: <input type=\"text\" class=\"fill-line\"></span>\n    </span>\n  </div>\n  <div class=\"row\">\n    <span>Target weight: <input type=\"text\" class=\"fill-line short\"> kg</span>\n    <span>Current dialysis unit: <input type=\"text\" class=\"fill-line\"></span>\n    <span>Dialysis physician: <input type=\"text\" class=\"fill-line\"></span>\n  </div>\n  <div class=\"q\">\n    <span class=\"prompt\">How much urine do you make each day?</span>\n    <span class=\"opts\">\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> None</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> &lt;1 cup</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> 1 cup to 1 quart</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> &gt;1 quart</span>\n    </span>\n  </div>\n</section>\n\n<!-- INFECTION HISTORY -->\n<section>\n  <h3>2. Infection History</h3>\n  <div class=\"q\">\n    <span class=\"prompt\">Have you had a skin test for tuberculosis (TB)?</span>\n    <span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Yes</span></span>\n  </div>\n  <div class=\"row\">\n    <span>If yes, date of test: <input type=\"text\" class=\"fill-line short\"> / <input type=\"text\" class=\"fill-line short\"> / <input type=\"text\" class=\"fill-line short\"></span>\n    <span>Result: <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Negative</span> <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Positive</span></span>\n  </div>\n  <div class=\"q\">\n    <span class=\"prompt\">Have you had any other infections that required hospitalization?</span>\n    <span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Yes \u2014 if yes, list below:</span></span>\n  </div>\n  <table>\n    <tr><th>Date</th><th>Type of Infection</th><th>Hospital</th></tr>\n    <tr><td><input type=\"text\" class=\"cell-input\"></td><td><input type=\"text\" class=\"cell-input\"></td><td><input type=\"text\" class=\"cell-input\"></td></tr>\n    <tr><td><input type=\"text\" class=\"cell-input\"></td><td><input type=\"text\" class=\"cell-input\"></td><td><input type=\"text\" class=\"cell-input\"></td></tr>\n  </table>\n\n  <div class=\"q\" style=\"margin-top:12px;\"><strong>Have you ever tested positive and been told by your doctor that you have or had <u>active</u>:</strong></div>\n  <div class=\"row\">\n    <span>HIV or AIDS? <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> No</span> <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Yes</span></span>\n  </div>\n  <div class=\"row\">\n    <span>Hepatitis C? <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> No</span> <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Yes</span></span>\n  </div>\n  <div class=\"row\">\n    <span>Hepatitis B? <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> No</span> <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Yes</span></span>\n  </div>\n</section>\n\n<!-- VACCINATION HISTORY -->\n<section>\n  <h3>3. Vaccination History</h3>\n  <table>\n    <tr><th>Vaccine</th><th>No</th><th>Yes</th><th>Year</th></tr>\n    <tr><td>Hepatitis B</td><td class=\"box\" style=\"width:20px;\"></td><td class=\"box\" style=\"width:20px;\"></td><td><input type=\"text\" class=\"cell-input\"></td></tr>\n    <tr><td>COVID</td><td class=\"box\"></td><td class=\"box\"></td><td><input type=\"text\" class=\"cell-input\"></td></tr>\n    <tr><td>HPV</td><td class=\"box\"></td><td class=\"box\"></td><td><input type=\"text\" class=\"cell-input\"></td></tr>\n    <tr><td>Zostavax</td><td class=\"box\"></td><td class=\"box\"></td><td><input type=\"text\" class=\"cell-input\"></td></tr>\n    <tr><td>Pneumovax</td><td class=\"box\"></td><td class=\"box\"></td><td><input type=\"text\" class=\"cell-input\"></td></tr>\n    <tr><td>Flu</td><td class=\"box\"></td><td class=\"box\"></td><td><input type=\"text\" class=\"cell-input\"></td></tr>\n  </table>\n</section>\n\n<!-- CARDIOVASCULAR HISTORY -->\n<section>\n  <h3>4. Cardiovascular History</h3>\n  <p class=\"note\">Please place a check mark by all the conditions you have now or have had in the past:</p>\n  <div class=\"grid2\">\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> None</span>\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Pericarditis</span>\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Hypertension (high blood pressure)</span>\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Fluid around the heart</span>\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Take medicine for high blood pressure</span>\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Problems with heart valves</span>\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Take blood thinners</span>\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Problems with circulation</span>\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Angina (chest pains)</span>\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Open heart surgery</span>\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Blood clot in legs (DVT)</span>\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Angioplasty (balloon dilatation)</span>\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Blood clot in lungs (Pulmonary Embolus)</span>\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Cardiac catheterization</span>\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Heart attack \u2014 date of most recent: <input type=\"text\" class=\"fill-line short\"></span>\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Stroke \u2014 date of most recent: <input type=\"text\" class=\"fill-line short\"></span>\n  </div>\n  <div class=\"row\" style=\"margin-top:10px;\">\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Cardiac tests \u2014 Echo: <input type=\"text\" class=\"fill-line\"></span>\n    <span>Stress test: <input type=\"text\" class=\"fill-line\"></span>\n    <span>Date and facility: <input type=\"text\" class=\"fill-line\"></span>\n  </div>\n</section>\n\n<!-- GASTROINTESTINAL HISTORY -->\n<section>\n  <h3>5. Gastrointestinal History</h3>\n  <p class=\"note\">Please place a check mark by all the conditions you have now or have had in the past:</p>\n  <div class=\"grid2\">\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> None</span>\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Diverticulosis</span>\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Stomach ulcer \u2014 active within last year? <input type=\"checkbox\" class=\"box\" style=\"width:11px;height:11px;\"> No <input type=\"checkbox\" class=\"box\" style=\"width:11px;height:11px;\"> Yes</span>\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Diverticulitis</span>\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Gallstones</span>\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Pancreatitis</span>\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Gallbladder problems</span>\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Bleeding from stomach or bowels</span>\n  </div>\n  <div class=\"q\" style=\"margin-top:8px;\">Do you have any difficulty with swallowing your food or medications? <input type=\"text\" class=\"fill-line\"></div>\n  <div class=\"q\">\n    <span class=\"prompt\">Have you ever had a colonoscopy?</span>\n    <span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Yes</span></span>\n  </div>\n  <div class=\"row\">\n    <span>If yes, date of most recent colonoscopy: <input type=\"text\" class=\"fill-line short\"> / <input type=\"text\" class=\"fill-line short\"> / <input type=\"text\" class=\"fill-line short\"></span>\n    <span>Hospital where it was performed: <input type=\"text\" class=\"fill-line\"></span>\n  </div>\n</section>\n\n<!-- CANCER HISTORY -->\n<section>\n  <h3>6. Cancer History</h3>\n  <div class=\"q\">\n    <span class=\"prompt\">Have you ever had a cancer or tumor?</span>\n    <span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Yes</span></span>\n    <span class=\"note\">(If no, skip to section 6.)</span>\n  </div>\n  <div class=\"q\">Date of diagnosis: <input type=\"text\" class=\"fill-line short\"> / <input type=\"text\" class=\"fill-line short\"></div>\n  <div class=\"q\">\n    <strong>What type of cancer or tumor did you have?</strong> (Check all that apply)\n    <div class=\"grid2\" style=\"margin-top:6px;\">\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Breast</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Prostate</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Stomach or bowel</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Skin</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Kidney</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Other; specify: <input type=\"text\" class=\"fill-line\"></span>\n    </div>\n  </div>\n  <div class=\"q\">What stage was the tumor at diagnosis? <input type=\"text\" class=\"fill-line\"></div>\n  <div class=\"q\">\n    <span class=\"prompt\">Did it spread outside of the original tumor site?</span>\n    <span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Yes</span></span>\n  </div>\n  <div class=\"q\">\n    If yes, where?\n    <span class=\"opts\">\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Brain</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Liver</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Bone</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Other; specify: <input type=\"text\" class=\"fill-line\"></span>\n    </span>\n  </div>\n  <div class=\"q\">\n    <strong>How was the tumor treated?</strong> (Check all that apply)\n    <div class=\"row\" style=\"margin-top:6px;\">\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> None</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Chemotherapy</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Radiation</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Surgery</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Other; specify: <input type=\"text\" class=\"fill-line\"></span>\n    </div>\n    Year treated: <input type=\"text\" class=\"fill-line short\">\n  </div>\n</section>\n\n<!-- DIABETES HISTORY -->\n<section>\n  <h3>7. Diabetes History</h3>\n  <p class=\"note\">If you are now or ever have been diabetic, please complete this section:</p>\n  <div class=\"q\">How old were you when diagnosed: <input type=\"text\" class=\"fill-line short\"> years</div>\n  <div class=\"q\"><span class=\"prompt\">Is there a family history of diabetes?</span><span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Yes</span></span></div>\n  <div class=\"q\"><span class=\"prompt\">Have you had episodes of DKA (diabetic ketoacidosis)?</span><span class=\"o our maximum daily insulin dose? <input type=\"text\" class=\"fill-line short\"> units</div>\n  <div class=\"q\">\n    <span class=\"prompt\">How often do you check your blood sugar?</span>\n    <span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> &gt;3x a day</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> 1x a day</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Not every day</span></span>\n  </div>\n</section>\n\n<!-- COPD -->\n<section>\n  <h3>8. Chronic Obstructive Pulmonary Disease (COPD)</h3>\n  <div class=\"q\"><span class=\"prompt\">Do you have a history of COPD?</span><span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Yes</span></span></div>\n  <div class=\"q\"><span class=\"prompt\">Have you received treatment for COPD?</span><span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Yes</span></span></div>\n</section>\n\n<!-- NEUROPSYCHIATRIC -->\n<section>\n  <h3>9. Neuropsychiatric History</h3>\n  <div class=\"q\"><span class=\"prompt\">Have you ever been hospitalized for psychiatric problems?</span><span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Yes</span></span></div>\n  <div class=\"q\"><span class=\"prompt\">Have you ever been under the care of a psychiatrist?</span><span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Yes</span></span></div>\n  <div class=\"q\"><span class=\"prompt\">Do you take medicine for psychiatric problems?</span><span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Yes</span></span></div>  following information for all kidney transplants:</p>\n  <table>\n    <tr><th>Transplant Date</th><th>Type of Transplant</th><th>Hospital</th><th>Graft Failure Date</th><th>Date Resumed Dialysis</th></tr>\n    <tr><td><input type=\"text\" class=\"cell-input\"></td><td>\u2610 Living related &nbsp;\u2610 Living non-related &nbsp;\u2610 Cadaver</td><td><input type=\"text\" class=\"cell-input\"></td><td><input type=\"text\" class=\"cell-input\"></td><td><input type=\"text\" class=\"cell-input\"></td></tr>\n    <tr><td><input type=\"text\" class=\"cell-input\"></td><td>\u2610 Living related &nbsp;\u2610 Living non-related &nbsp;\u2610 Cadaver</td><td><input type=\"text\" class=\"cell-input\"></td><td><input type=\"text\" class=\"cell-input\"></td><td><input type=\"text\" class=\"cell-input\"></td></tr>\n  </table>\n\n  <div class=\"q\" style=\"margin-top:12px;\"><span class=\"prompt\">Have you had any other organ transplants?</span><span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Yes \u2014 if yes, complete the following:</span></span></div>\n  <table>\n    <tr><th>Transplant Date</th><th>Organ(s) Transplanted</th><th>Hospital</th></tr>\n    <tr><td><input type=\"text\" class=\"cell-input\"></td><td><input type=\"text\" class=\"cell-input\"></td><td><input type=\"text\" class=\"cell-input\"></td></tr>\n    <tr><td><input type=\"text\" class=\"cell-input\"></td><td><input type=\"text\" class=\"cell-input\"></td><td><input type=\"text\" class=\"cell-input\"></td></tr>\n  </table>\n\n  <div class=\"q\" style=\"margin-top:12px;\">\n    <span class=\"prompt\">Have you donated a vital organ?</span>\n    <span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Yes</span></span>\n  </div>\n  <div class=\"q\">\n    If so, which one(s)?\n    <span class=\"opts\">\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Kidney</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Liver</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Lung</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Intestine</span>\n    </span>\n  </div>\n</section>\n\n<!-- GYNECOLOGIC -->\n<section>\n  <h3>10. Gynecologic History (for women only)</h3>\n  <div class=\"row\">\n    <span>How many pregnancies have you had? <input type=\"text\" class=\"fill-line short\"></span>\n    <span>How many live births? <input type=\"text\" class=\"fill-line short\"></span>\n    <span>How many miscarriages or abortions? <input type=\"text\" class=\"fill-line short\"></span>\n  </div>\n  <div class=\"q\">Name of current GYN provider: <input type=\"text\" class=\"fill-line\"></div>\n  <div class=\"q\">Date of last pelvic exam and Pap smear: <input type=\"text\" class=\"fill-line short\"> / <input type=\"text\" class=\"fill-line short\"></div>\n  <div class=\"q\"><span class=\"prompt\">Have you ever had a mammogram?</span><span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Yes</span></span></div>\n  <div class=\"row\">\n    <span>If yes, date: <input type=\"text\" class=\"fill-line short\"> / <input type=\"text\" class=\"fill-line short\"></span>\n    <span>Hospital: <input type=\"text\" class=\"fill-line\"></span>\n  </div>\n</section>\n\n<!-- DENTAL -->\n<section>\n  <h3>11. Dental History</h3>\n  <div class=\"q\">Date of last dental exam: <input type=\"text\" class=\"fill-line short\"> / <input type=\"text\" class=\"fill-line short\"></div>\n  <div class=\"q\"><span class=\"prompt\">Do you have dentures?</span><span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\"> Yes</span></span></div>\n  <div class=\"q\"><span class=\"opts const TODAY = () => new Date(new Date().toDateString());
const iso = (d) => {
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
};
const parseISO = (s) => (s ? new Date(s + 'T00:00:00') : null);
const addDays = (d, n) => new Date(d.getTime() + n * 86400000);
const fmt = (s) => {
  const d = parseISO(s);
  if (!d) return '';
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
};
const el = (tag, attrs = {}, kids = []) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  (Array.isArray(kids) ? kids : [kids]).forEach((c) => { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return n;
};

};
