<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Transplant Coordinator Tracker — NNUH Kidney Transplant Program</title>
<meta name="description" content="Interactive donor and recipient checklist and follow-up tracker for the An-Najah National University Hospital Kidney Transplant Program.">
<style>
:root{
  --navy:#1f3864; --blue:#2e5c8a; --light:#eaf0f7; --band:#f5f8fc;
  --ink:#16202e; --muted:#5c6b7f; --line:#d6dfea; --bg:#f2f5f9; --card:#fff;
  --ok:#1e7a44; --ok-bg:#e4f4ea; --warn:#8a5a00; --warn-bg:#fdf1d8;
  --bad:#a32020; --bad-bg:#fbe6e4; --na:#6b7684; --na-bg:#eceff3;
  --radius:10px; --shadow:0 1px 2px rgba(20,35,60,.06),0 2px 8px rgba(20,35,60,.05);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;cursor:pointer}
input{font:inherit;color:inherit}

/* ---------- app bar ---------- */
.appbar{position:sticky;top:0;z-index:60;background:var(--navy);color:#fff;box-shadow:0 1px 0 rgba(0,0,0,.15)}
.appbar-in{max-width:1240px;margin:0 auto;padding:12px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.25;margin-right:auto}
.brand strong{font-size:16px;font-weight:650}
.brand span{font-size:12px;color:#b9c8de}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{
  border:1px solid transparent;border-radius:8px;padding:7px 13px;font-size:13.5px;font-weight:550;
  background:#fff;color:var(--navy);transition:background .12s,border-color .12s,transform .06s;
}
.btn:hover{background:#eef3fa}
.btn:active{transform:translateY(1px)}
.btn-ghost{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.32)}
.btn-ghost:hover{background:rgba(255,255,255,.2)}
.savestate{font-size:12px;padding:4px 10px;border-radius:20px;font-weight:600;white-space:nowrap}
.savestate.saved{background:rgba(255,255,255,.14);color:#cfe3d4}
.savestate.unsaved{background:#ffd8a8;color:#7a4a00}

.chips{max-width:1240px;margin:0 auto;padding:0 20px 10px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;gap:7px;align-items:baseline;background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:3px 12px;font-size:12.5px;color:#e6eef8}
.chip strong{font-size:13.5px}
.chip.ok strong{color:#a8e6bf}.chip.warn strong{color:#ffd89a}.chip.bad strong{color:#ffb3ac}
.chip-l{color:#b9c8de}

/* ---------- tabs ---------- */
.tabs{background:var(--blue);position:sticky;top:0;z-index:55}
.tabs-in{max-width:1240px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto}
.tab{background:none;border:0;color:#d8e5f3;padding:11px 15px;font-size:13.5px;font-weight:550;
  border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:#fff;background:rgba(255,255,255,.07)}
.tab.active{color:#fff;border-bottom-color:#fff;background:rgba(255,255,255,.1)}

/* ---------- layout ---------- */
main{max-width:1240px;margin:0 auto;padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.card h2{font-size:17px;color:var(--navy)}
.card .sub{font-size:13px;color:var(--muted);margin-top:3px}
.sticky-head{position:sticky;top:44px;z-index:40}
.group{padding:0;overflow:hidden}
.group-title{font-size:15.5px;font-weight:650;color:var(--navy);background:transparent;padding:0 0 8px;
  margin:0 0 14px;border-bottom:2px solid var(--navy);letter-spacing:normal}

/* ---------- forms ---------- */
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.field{display:flex;flex-direction:column;gap:4px}
.field>span{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.field input{border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:#fff;min-width:0}
.field input:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
.field.small>span{font-size:10.5px}
.field.small input{padding:5px 8px;font-size:13px}
.field.grow{flex:1 1 200px}
.warn-input{border-color:#e0a63c!important;background:#fffaf0}

.toolbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-top:14px}
.search{flex:1 1 240px;border:1px solid var(--line);border-radius:7px;padding:7px 11px}
.search:focus{outline:2px solid var(--blue);outline-offset:-1px}
.segmented{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg-btn{border:0;background:#fff;padding:7px 13px;font-size:13px;color:var(--muted);border-right:1px solid var(--line)}
.seg-btn:last-child{border-right:0}
.seg-btn.on{background:var(--navy);color:#fff;font-weight:600}
.seg-btn:hover:not(.on){background:var(--light)}

/* ---------- progress ---------- */
.big-pct{font-size:38px;font-weight:700;color:var(--navy);line-height:1.1;margin:10px 0 6px}
.bar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--na-bg);margin:10px 0}
.seg{height:100%}
.seg-complete{background:var(--ok)}
.seg-pending{background:#e0a63c}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stat{display:flex;flex-direction:column;background:var(--band);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stat strong{font-size:19px;line-height:1.1}
.stat span{font-size:11px;color:var(--muted);margin-top:2px}
.inline-stats{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px;align-items:center}
.inline-stats strong{color:var(--ink);font-size:14px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.muted{color:var(--na)}
.ready{border-radius:8px;padding:9px 12px;font-weight:650;font-size:13.5px;text-align:center;margin-bottom:12px}
.ready-yes{background:var(--ok-bg);color:var(--ok)}
.ready-no{background:var(--bad-bg);color:var(--bad)}
.ready-inline{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700}
.ready-inline.ready-yes{background:var(--ok-bg);color:var(--ok)}
.ready-inline.ready-no{background:var(--bad-bg);color:var(--bad)}
.btn-quiet{border-color:var(--line);width:100%;color:var(--blue)}

/* ---------- items (compact printable-checklist style) ---------- */
.item{display:block;padding:9px 16px;border-top:1px solid var(--line)}
.group .item:first-of-type{border-top:0}
.item.s-complete{background:linear-gradient(90deg,var(--ok-bg) 0 3px,#fff 3px)}
.item.s-pending{background:linear-gradient(90deg,#e0a63c 0 3px,#fff 3px)}
.item.s-todo{background:linear-gradient(90deg,var(--bad) 0 3px,#fff 3px)}
.item.s-na{background:linear-gradient(90deg,var(--na) 0 3px,#fafbfc 3px);opacity:.72}
.item.v-attended{background:linear-gradient(90deg,var(--ok) 0 3px,#fff 3px)}
.item.v-overdue{background:linear-gradient(90deg,var(--bad) 0 3px,#fff 3px)}
.item.v-due{background:linear-gradient(90deg,#e0a63c 0 3px,#fff 3px)}
.item.v-scheduled,.item.v-unset{background:#fff}
.item.is-gate .item-text{font-weight:650;color:var(--navy)}
.item-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px}
.item-check{width:17px;height:17px;flex:none;border:1.5px solid var(--navy);border-radius:3px;accent-color:var(--navy);cursor:pointer;margin:0}
.item-text{flex:1 1 260px;min-width:160px}
.ref-tiny{font-size:11px;color:var(--muted);white-space:nowrap}
.date-tiny{width:118px;font-size:12px;padding:2px 4px;border:none;border-bottom:1px solid #999;border-radius:0;background:transparent;color:var(--ink)}
.date-tiny:focus{border-bottom:1.5px solid var(--navy);background:var(--band);outline:none}
.pending-tiny{border:1px solid var(--line);background:#fff;color:var(--warn);border-radius:5px;padding:2px 7px;font-size:11px;font-weight:600;cursor:pointer}
.pending-tiny.on{background:var(--warn-bg);border-color:#e0a63c}
.na-tiny{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);cursor:pointer}
.na-tiny input{width:14px;height:14px;accent-color:var(--navy);margin:0;cursor:pointer}
.item-extra{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;padding-left:25px}
.item-extra .field{flex:none}
.item-extra .field span{font-size:10.5px;color:var(--muted);display:block;margin-bottom:1px}
.item-extra .field input,.item-extra .field select{font-size:12.5px;padding:2px 2px;border:none;border-bottom:1px solid #999;border-radius:0;background:transparent;min-width:110px}
.item-extra .field input:focus,.item-extra .field select:focus{border-bottom:1.5px solid var(--navy);background:var(--band);outline:none}
.item-components{display:flex;gap:10px;flex-wrap:wrap}
.item-components .field input{min-width:70px}
.dates{display:flex;gap:8px}
.tests{font-size:12.5px;color:var(--muted);margin-top:6px;max-width:70ch}
.ref{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;background:var(--band);
  border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.due{font-size:12px;color:var(--muted)}
.gate-pill{background:var(--navy);color:#fff;font-size:10px;font-weight:700;letter-spacing:.06em;
  border-radius:4px;padding:2px 6px}
.na{display:flex;gap:5px;align-items:center;font-size:12.5px;color:var(--muted);padding-bottom:6px;white-space:nowrap}
.na input{width:15px;height:15px}
.btn-tick{border-color:var(--line);background:#fff;color:var(--ok);min-width:118px}
.btn-tick.on{background:var(--ok);border-color:var(--ok);color:#fff}

.badge{font-size:11px;font-weight:650;border-radius:20px;padding:2px 9px;white-space:nowrap}
.b-complete,.b-attended{background:var(--ok-bg);color:var(--ok)}
.b-pending,.b-due{background:var(--warn-bg);color:var(--warn)}
.b-todo,.b-overdue{background:var(--bad-bg);color:var(--bad)}
.b-na,.b-scheduled,.b-unset{background:var(--na-bg);color:var(--na)}

/* ---------- misc ---------- */
.gate-list{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.gate-list li{display:flex;gap:9px;align-items:baseline;font-size:13.5px;padding:8px 11px;
  background:var(--bad-bg);border-radius:7px}
.tag{font-size:10.5px;font-weight:700;border-radius:4px;padding:2px 7px;white-space:nowrap}
.tag-d{background:#dbe7f6;color:#1b4a80}
.tag-r{background:#e6e0f5;color:#4a327d}
.ok-note{margin-top:12px;background:var(--ok-bg);color:var(--ok);padding:10px 12px;border-radius:8px;font-weight:600;font-size:13.5px}
.muted-note{margin-top:12px;color:var(--muted);font-size:13.5px}
table.grid{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
table.grid th{text-align:left;background:var(--band);color:var(--muted);font-size:11.5px;
  text-transform:uppercase;letter-spacing:.04em;padding:7px 10px;border-bottom:1px solid var(--line)}
table.grid td{padding:8px 10px;border-bottom:1px solid var(--line)}
dl.help{margin:14px 0 0}
dl.help dt{font-weight:650;color:var(--navy);font-size:13.5px;margin-top:14px}
dl.help dd{margin:4px 0 0;color:var(--ink);font-size:13.5px;max-width:80ch}
.keygrid{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);background:var(--navy);color:#fff;
  padding:11px 18px;border-radius:9px;font-size:13.5px;opacity:0;transition:.25s;z-index:200;box-shadow:0 6px 24px rgba(0,0,0,.22)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--bad)}
.patient-banner{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:12px 20px;
  display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;position:sticky;top:44px;z-index:50}
.patient-banner b{font-size:20px;font-weight:750;letter-spacing:-.01em}
.patient-banner span{color:#dbe6f4;font-size:14px}
#caseActions{align-items:center}
.case-actions.off{display:none}
.case-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.case-actions .btn{background-color:#fff!important;color:var(--navy)!important}
.case-actions .btn.btn-ghost{background-color:rgba(255,255,255,.16)!important;color:#fff!important}

/* ---------- registry / cloud ---------- */
.cloud-pill{font-size:12px;padding:4px 10px;border-radius:20px;font-weight:600;white-space:nowrap}
.cloud-pill.on{background:rgba(255,255,255,.14);color:#cfe3d4}
.cloud-pill.off{background:#ffd8a8;color:#7a4a00}
.cloud-pill.busy{background:rgba(255,255,255,.14);color:#e6eef8}
.reg-hero{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border-radius:var(--radius);
  padding:24px 26px;box-shadow:var(--shadow)}
.reg-hero h2{color:#fff;font-size:20px}
.reg-hero p{color:#dbe6f4;margin-top:5px;font-size:13.5px;max-width:70ch}
.case-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.case-row{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;
  background:#fff;border:1px solid var(--line);border-radius:9px;padding:12px 14px;cursor:pointer;transition:border-color .12s,box-shadow .12s}
.case-row:hover{border-color:var(--blue);box-shadow:0 2px 10px rgba(30,60,100,.08)}
.case-row .who{display:flex;flex-direction:column;gap:2px}
.case-row .who b{font-size:14px;color:var(--ink)}
.case-row .who span{font-size:12px;color:var(--muted)}
.case-row .mrns{font-size:12px;color:var(--muted);text-align:right}
.case-row .upd{font-size:11px;color:var(--na);white-space:nowrap}
.empty-state{padding:20px;text-align:center;color:var(--muted);font-size:13.5px}
.patient-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.patient-head h2{font-size:19px}
.sheet-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.sheet-tile{border:1px solid var(--line);background:#fff;border-radius:9px;padding:14px 14px;text-align:left}
.sheet-tile:hover{border-color:var(--blue);background:var(--light)}
.sheet-tile b{display:block;font-size:14px;color:var(--navy);margin-bottom:4px}
.sheet-tile span{font-size:12px;color:var(--muted)}
.sheet-tile .pct{float:right;font-weight:700;color:var(--navy)}
@media(max-width:900px){.sheet-tiles{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.sheet-tiles{grid-template-columns:1fr}}

/* ---------- modal ---------- */
.modal-back{position:fixed;inset:0;background:rgba(15,25,40,.5);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:12px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:22px 24px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.modal h2{font-size:17px;color:var(--navy)}
.modal .sub{font-size:12.5px;color:var(--muted);margin-top:4px}
.modal .form-grid{grid-template-columns:1fr}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.pending-toggle{border:1px solid var(--line);background:#fff;color:var(--warn);border-radius:7px;padding:6px 10px;font-size:12.5px;font-weight:600;min-width:96px}
.pending-toggle.on{background:var(--warn-bg);border-color:#e0a63c}
.reminder-preview{background:var(--band);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px;max-height:220px;overflow:auto;white-space:pre-wrap}

@media(max-width:900px){
  .two-col{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr 1fr}
  .item{grid-template-columns:1fr}
  .item-ctl{justify-content:flex-start}
  .sticky-head{position:static}
}
@media(max-width:560px){.form-grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}

/* ---------- print ---------- */
@media print{
  body{background:#fff}
  .appbar,.tabs,.toolbar,.btn,.na input,.toast,.chips{display:none!important}
  main{max-width:none;padding:0}
  .card{border:0;box-shadow:none;padding:0 0 10px;break-inside:auto}
  .sticky-head{position:static}
  .item{break-inside:avoid;padding:6px 0;border-top:1px solid #ccc}
  .group-title{background:transparent!important;color:#000!important;border-bottom:2px solid #000!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .badge,.ready,.chip{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .field input{border:0;border-bottom:1px solid #999;border-radius:0}
  #printAll{display:block!important}
}

</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-in">
    <div class="brand">
      <strong>Transplant Coordinator Tracker</strong>
      <span>An-Najah National University Hospital &middot; Kidney Transplant Program &middot; Manual v2.1</span>
    </div>
    <div class="actions">
      <button class="btn btn-ghost" id="btnBack" style="visibility:hidden">&#8592; Back</button>
      <button class="btn btn-ghost" id="btnHome">&#8962; Registry</button>
      <button class="btn btn-ghost" id="btnSwitch">&#128100; View all donors &amp; recipients</button>
      <span id="saveState" class="cloud-pill off">Cloud not configured</span>
      <div id="caseActions" class="case-actions off">
        <button class="btn" id="btnExportSheet">Export to Google Sheet</button>
        <button class="btn btn-ghost" id="btnPdf">Download PDF</button>
        <button class="btn btn-ghost" id="btnCsv">Export CSV</button>
        <button class="btn btn-ghost" id="btnPrint">Print</button>
      </div>
      <button class="btn btn-ghost" id="btnRemind">Email reminder</button>
      <button class="btn btn-ghost" id="btnSettings">Settings</button>
      <input type="file" id="fileInput" accept="application/json,.json" hidden>
    </div>
  </div>
  <div class="chips" id="headerChips"></div>
</header>

<nav class="tabs">
  <div class="tabs-in">
      <button class="tab" data-tab="overview">Overview</button>
      <button class="tab" data-tab="intake">Donor Questionnaire</button>
      <button class="tab" data-tab="donor">Donor checklist</button>
      <button class="tab" data-tab="recipient">Recipient checklist</button>
      <button class="tab" data-tab="rfu">Recipient follow-up</button>
      <button class="tab" data-tab="dfu">Donor follow-up</button>
      <button class="tab" data-tab="help">How to use</button>
  </div>
</nav>
<div id="patientBanner" class="patient-banner" style="display:none"></div>

<main id="app"></main>
<div id="modalRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" onerror="window.__jspdfFailed=true"></script>

input type=\"checkbox\" class=\"box\" data-field=\"iq52\"> Quit 6\u201312 months ago</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq53\"> Quit &gt;12 months ago</span>\n    </span>\n  </div>\n\n  <div class=\"q\">\n    <span class=\"prompt\"><strong>Illegal drug use:</strong></span>\n    <div class=\"grid2\" style=\"margin-top:6px;\">\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq54\"> Not assessed</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq55\"> Current user</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq56\"> Never used illegal drugs</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq57\"> Experimentation in past only</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq58\"> Past regular user, quit &lt;1 year ago</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq59\"> Past regular user, quit &gt;1 year ago</span>\n    </div>\n    <div class=\"row\" style=\"margin-top:6px;\">\n      <span><input type=\"checkbox\" class=\"box\" style=\"width:11px;height:11px;\" data-field=\"iq60\"> Marijuana</span>\n      <span><input type=\"checkbox\" class=\"box\" style=\"width:11px;height:11px;\" data-field=\"iq61\"> Narcotics</span>\n      <span><input type=\"checkbox\" class=\"box\" style=\"width:11px;height:11px;\" data-field=\"iq62\"> IV drugs of any form</span>\n      <span>Other \u2014 specify: <input type=\"text\" class=\"fill-line\" data-field=\"iq63\"></span>\n    </div>\n  </div>\n\n  <div class=\"q\">\n    <span class=\"prompt\"><strong>Projected sources of payment</strong></span> <span class=\"note\">(enter 1 for primary source, 2 for secondary source)</span>\n    <div class=\"grid3\" style=\"margin-top:6px;\">\n      <span><input type=\"text\" class=\"fill-line short\" data-field=\"iq64\"> Governmen class=\"prompt\">First dialysis method:</span>\n    <span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq82\"> Hemodialysis</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq83\"> Peritoneal dialysis</span></span>\n  </div>\n  <div class=\"q\">\n    <span class=\"prompt\">Current dialysis method:</span>\n    <span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq84\"> Hemodialysis</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq85\"> Peritoneal dialysis</span></span>\n  </div>\n  <div class=\"q\">\n    <span class=\"prompt\">Problems with multiple dialysis access (catheter, fistula, graft, etc.)?</span>\n    <span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq86\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq87\"> Yes</span></span>\n  </div>\n  <div class=\"q\">\n    <span class=\"prompt\">Problems with clotting in dialysis access (catheter, fistula, graft, etc.)?</span>\n    <span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq88\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq89\"> Yes</span></span>\n  </div>\n  <div class=\"q\">\n    <span class=\"prompt\">Dialysis days:</span>\n    <span class=\"opts\">\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq90\"> M, W, F</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq91\"> T, Th, S</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq92\"> Daily</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq93\"> Other: <input type=\"text\" class=\"fill-line\" data-field=\"iq94\"></span>\n    </span>\n  </div>\n  <div class=\"row\">\n    <span>Target weight: <input type=\"text\" class=\"fill-line short\" data-field=\"iq95\"> kg</span>\n    <span>Current dialysis unit: <input type=\"text\" class=\"fill-line\" data-field=\"iq96\"></span>\n    <span>Dialysis physician: <input type=\"text\" class=\"fill-line\" data-field=\"iq97\"></span>\n  </div>\n  <div class=\"q\">\n    <span class=\"prompt\">How much urine do you make each day?</span>\n    <span class=\"opts\">\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq98\"> None</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq99\"> &lt;1 cup</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq100\"> 1 cup to 1 quart</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq101\"> &gt;1 quart</span>\n    </span>\n  </div>\n</section>\n\n<!-- INFECTION HISTORY -->\n<section>\n  <h3>2. Infection History</h3>\n  <div class=\"q\">\n    <span class=\"prompt\">Have you had a skin test for tuberculosis (TB)?</span>\n    <span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq102\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq103\"> Yes</span></span>\n  </div>\n  <div class=\"row\">\n    <span>If yes, date of test: <input type=\"text\" class=\"fill-line short\" data-field=\"iq104\"> / <input type=\"text\" class=\"fill-line short\" data-field=\"iq105\"> / <input type=\"text\" class=\"fill-line short\" data-field=\"iq106\"></span>\n    <span>Result: <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq107\"> Negative</span> <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq108\"> Positive</span></span>\n  </div>\n  <div class=\"q\">\n    <span class=\"prompt\">Have you had any other infections that required hospitalization?</span>\n    <span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq109\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq110\"> Yes \u2014 if yes, list below:</span></span>\n  </div>\n  <table>\n    <tr><th>Date</th><th>Type of Infection</th><th>Hospital</th></tr>\n    <tr><td><input type=\"text\" class=\"cell-input\" data-field=\"iq111\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq112\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq113\"></td></tr>\n    <tr><td><input type=\"text\" class=\"cell-input\" data-field=\"iq114\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq115\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq116\"></td></tr>\n  </table>\n\n  <div class=\"q\" style=\"margin-top:12px;\"><strong>Have you ever tested positive and been told by your doctor that you have or had <u>active</u>:</strong></div>\n  <div class=\"row\">\n    <span>HIV or AIDS? <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq117\"> No</span> <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq118\"> Yes</span></span>\n  </div>\n  <div class=\"row\">\n    <span>Hepatitis C? <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq119\"> No</span> <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq120\"> Yes</span></span>\n  </div>\n  <div class=\"row\">\n    <span>Hepatitis B? <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq121\"> No</span> <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq122\"> Yes</span></span>\n  </div>\n</section>\n\n<!-- VACCINATION HISTORY -->\n<section>\n  <h3>3. Vaccination History</h3>\n  <table>\n    <tr><th>Vaccine</th><th>No</th><th>Yes</th><th>Year</th></tr>\n    <tr><td>Hepatitis B</td><td class=\"box\" style=\"width:20px;\"></td><td class=\"box\" style=\"width:20px;\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq123\"></td></tr>\n    <tr><td>COVID</td><td class=\"box\"></td><td class=\"box\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq124\"></td></tr>\n    <tr><td>HPV</td><td class=\"box\"></td><td class=\"box\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq125\"></td></tr>\n    <tr><td>Zostavax</td><td class=\"box\"></td><td class=\"box\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq126\"></td></tr>\n    <tr><td>Pneumovax</td><td class=\"box\"></td><td class=\"box\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq127\"></td></tr>\n    <tr><td>Flu</td><td class=\"box\"></td><td class=\"box\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq128\"></td></tr>\n  </table>\n</section>\n\n<!-- CARDIOVASCULAR HISTORY -->\n<section>\n  <h3>4. Cardiovascular History</h3>\n  <p class=\"note\">Please place a check mark by all the conditions you have now or have had in the past:</p>\n  <div class=\"grid2\">\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq129\"> None</span>\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq130\"> Pericarditis</span>\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq131\"> Hypertension (high blood pressure)</span>\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq132\"> Fluid around the heart</span>\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq133\"> Take medicine for high blood pressure</span>\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq134\"> Problems with heart valves</span>\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq135\"> Take blood thinners</span>\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq136\"> Problems with circulation</span>\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq137\"> Angina (chest pains)</span>\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq138\"> Open heart surgery</span>\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq139\"> Blood clot in legs (DVT)</span>\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq140\"> Angioplasty (balloon dilatation)</span>\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq141\"> Blood clot in lungs (Pulmonary Embolus)</span>\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq142\"> Cardiac catheterization</span>\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq143\"> Heart attack \u2014 date of most recent: <input type=\"text\" class=\"fill-line short\" data-field=\"iq144\"></span>\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq145\"> Stroke \u2014 date of most recent: <input type=\"text\" class=\"fill-line short\" data-field=\"iq146\"></span>\n  </div>\n  <div class=\"row\" style=\"margin-top:10px;\">\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq147\"> Cardiac tests \u2014 Echo: <input type=\"text\" class=\"fill-line\" data-field=\"iq148\"></span>\n    <span>Stress test: <input type=\"text\" class=\"fill-line\" data-field=\"iq149\"></span>\n    <span>Date and facility: <input type=\"text\" class=\"fill-line\" data-field=\"iq150\"></span>\n  </div>\n</section>\n\n<!-- GASTROINTESTINAL HISTORY -->\n<section>\n  <h3>5. Gastrointestinal History</h3>\n  <p class=\"note\">Please place a check mark by all the conditions you have now or have had in the past:</p>\n  <div class=\"grid2\">\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq151\"> None</span>\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq152\"> Diverticulosis</span>\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq153\"> Stomach ulcer \u2014 active within last year ox\" data-field=\"iq184\"> Bone</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq185\"> Other; specify: <input type=\"text\" class=\"fill-line\" data-field=\"iq186\"></span>\n    </span>\n  </div>\n  <div class=\"q\">\n    <strong>How was the tumor treated?</strong> (Check all that apply)\n    <div class=\"row\" style=\"margin-top:6px;\">\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq187\"> None</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq188\"> Chemotherapy</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq189\"> Radiation</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq190\"> Surgery</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq191\"> Other; specify: <input type=\"text\" class=\"fill-line\" data-field=\"iq192\"></span>\n    </div>\n    Year treated: <input type=\"text\" class=\"fill-line short\" data-field=\"iq193\">\n  </div>\n</section>\n\n<!-- DIABETES HISTORY -->\n<section>\n  <h3>7. Diabetes History</h3>\n  <p class=\"note\">If you are now or ever have been diabetic, please complete this section:</p>\n  <div class=\"q\">How old were you when diagnosed: <input type=\"text\" class=\"fill-line short\" data-field=\"iq194\"> years</div>\n  <div class=\"q\"><span class=\"prompt\">Is there a family history of diabetes?</span><span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq195\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq196\"> Yes</span></span></div>\n  <div class=\"q\"><span class=\"prompt\">Have you had episodes of DKA (diabetic ketoacidosis)?</span><span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq197\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq198\"> Yes</span></span></div>\n  <div class=\"q\"><span class=\"prompt\">Do you have retinopathy?</span><span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq199\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq200\"> Yes</span></span></div>\n  <div class=\"q\"><span class=\"prompt\">Have you had laser treatments?</span><span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq201\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq202\"> Yes</span></span>\n    \u2014 If yes, which eye? <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq203\"> Right</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq204\"> Left</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq205\"> Both</span>\n  </div>\n  <div class=\"q\"><span class=\"prompt\">Are you legally blind?</span><span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq206\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq207\"> Yes</span></span></div>\n  <div class=\"q\"><span class=\"prompt\">Do you have neuropathy (numbness &amp; tingling)?</span><span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq208\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq209\"> Yes</span></span></div>\n  <div class=\"q\"><span class=\"prompt\">Do you have gastropathy (nausea/vomiting)?</span><span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq210\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq211\"> Yes</span></span></div>\n  <div class=\"q\"><span class=\"prompt\">Do you have problems with non-healing foot ulcers?</span><span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq212\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq213\"> Yes</span></span></div>\n  <div class=\"q\">What was your maximum daily insulin dose? <input type=\"text\" class=\"fill-line short\" data-field=\"iq214\"> units</div>\n  <div class=\"q\">\n    <span class=\"prompt\">How often do you check your blood sugar?</span>\n    <span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq215\"> &gt;3x a day</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq216\"> 1x a day</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq217\"> Not every day</span></span>\n  </div>\n</section>\n\n<!-- COPD -->\n<section>\n  <h3>8. Chronic Obstructive Pulmonary Disease (COPD)</h3>\n  <div class=\"q\"><span class=\"prompt\">Do you have a history of COPD?</span><span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq218\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq219\"> Yes</span></span></div>\n  <div class=\"q\"><span class=\"prompt\">Have you received treatment for COPD?</span><span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq220\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq221\"> Yes</span></span></div>\n</section>\n\n<!-- NEUROPSYCHIATRIC -->\n<section>\n  <h3>9. Neuropsychiatric History</h3>\n  <div class=\"q\"><span class=\"prompt\">Have you ever been hospitalized for psychiatric problems?</span><span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq222\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq223\"> Yes</span></span></div>\n  <div class=\"q\"><span class=\"prompt\">Have you ever been under the care of a psychiatrist?</span><span class=\"opts\"><span class=\"opt\"><input type=\"che ype=\"text\" class=\"cell-input\" data-field=\"iq259\"></td></tr>\n    <tr><td><input type=\"text\" class=\"cell-input\" data-field=\"iq260\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq261\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq262\"></td></tr>\n  </table>\n\n  <div class=\"q\" style=\"margin-top:12px;\">\n    <span class=\"prompt\"><strong>Please list all known medication allergies:</strong></span>\n    <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq263\"> None</span>\n  </div>\n  <table>\n    <tr><td><input type=\"text\" class=\"cell-input\" data-field=\"iq264\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq265\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq266\"></td></tr>\n    <tr><td><input type=\"text\" class=\"cell-input\" data-field=\"iq267\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq268\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq269\"></td></tr>\n  </table>\n\n  <div class=\"q\" style=\"margin-top:12px;\"><span class=\"prompt\">Have you ever had any previous exposure to or have a known allergy to rabbits?</span><span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq270\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq271\"> Yes</span></span></div>\n  <div class=\"q\">If yes, what was your reaction? <input type=\"text\" class=\"fill-line long\" data-field=\"iq272\"></div>\n\n  <div class=\"q\"><span class=\"prompt\">Have you ever been transfused with blood?</span><span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq273\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq274\"> Yes</span></span></div>\n  <div class=\"q\">If yes, when was your last transfusion? <input type=\"text\" class=\"fill-line short\" data-field=\"iq275\"> / <input type=\"text\" class=\"fill-line short\" data-field=\"iq276\"> / <input type=\"text\" class=\"fill-line short\" data-field=\"iq277\"></div>\n  <div class=\"q\">\n    How many total pints have you received in your lifetime?\n    <span class=\"opts\">\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq278\"> 0</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq279\"> 1</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq280\"> 2\u20135</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq281\"> 6\u201310</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq282\"> &gt;10</span>\n    </span>\n  </div>\n  <div class=\"q\">\n    What is your blood type?\n    <span class=\"opts\">\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq283\"> A</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq284\"> B</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq285\"> AB</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq286\"> O</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq287\"> Unknown</span>\n    </span>\n  </div>\n\n  <h3 style=\"margin-top:16px;\">Transplant History</h3>\n  <div class=\"q\"><span class=\"prompt\">Have you had a kidney transplant before?</span><span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq288\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq289\"> Yes</span></span></div>\n  <p class=\"note\">If yes, complete the following information for all kidney transplants:</p>\n  <table>\n    <tr><th>Transplant Date</th><th>Type of Transplant</th><th>Hospital</th><th>Graft Failure Date</th><th>Date Resumed Dialysis</th></tr>\n    <tr><td><input type=\"text\" class=\"cell-input\" data-field=\"iq290\"></td><td>\u2610 Living related &nbsp;\u2610 Living non-related &nbsp;\u2610 Cadaver</td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq291\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq292\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq293\"></td></tr>\n    <tr><td><input type=\"text\" class=\"cell-input\" data-field=\"iq294\"></td><td>\u2610 Living related &nbsp;\u2610 Living non-related &nbsp;\u2610 Cadaver</td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq295\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq296\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq297\"></td></tr>\n  </table>\n\n  <div class=\"q\" style=\"margin-top:12px;\"><span class=\"prompt\">Have you had any other organ transplants?</span><span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq298\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq299\"> Yes \u2014 if yes, complete the following:</span></span></div>\n  <table>\n    <tr><th>Transplant Date</th><th>Organ(s) Transplanted</th><th>Hospital</th></tr>\n    <tr><td><input type=\"text\" class=\"cell-input\" data-field=\"iq300\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq301\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq302\"></td></tr>\n    <tr><td><input type=\"text\" class=\"cell-input\" data-field=\"iq303\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq304\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq305\"></td></tr>\n  </table>\n\n  <div class=\"q\" style=\"margin-top:12px;\">\n    <span class=\"prompt\">Have you donated a vital organ?</span>\n    <span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq306\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq307\"> Yes</span></span>\n  </div>\n  <div class=\"q\">\n    If so, which one(s)?\n    <span class=\"opts\">\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq308\"> Kidney</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq309\"> Liver</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq310\"> Lung</span>\n      <span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq311\"> Intestine</span>\n    </span>\n  </div>\n</section>\n\n<!-- GYNECOLOGIC -->\n<section>\n  <h3>10. Gynecologic History (for women only)</h3>\n  <div class=\"row\">\n    <span>How many pregnancies have you had? <input type=\"text\" class=\"fill-line short\" data-field=\"iq312\"></span>\n    <span>How many live births? <input type=\"text\" class=\"fill-line short\" data-field=\"iq313\"></span>\n    <span>How many miscarriages or abortions? <input type=\"text\" class=\"fill-line short\" data-field=\"iq314\"></span>\n  </div>\n  <div class=\"q\">Name of current GYN provider: <input type=\"text\" class=\"fill-line\" data-field=\"iq315\"></div>\n  <div class=\"q\">Date of last pelvic exam and Pap smear: <input type=\"text\" class=\"fill-line short\" data-field=\"iq316\"> / <input type=\"text\" class=\"fill-line short\" data-field=\"iq317\"></div>\n  <div class=\"q\"><span class=\"prompt\">Have you ever had a mammogram?</span><span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq318\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq319\"> Yes</span></span></div>\n  <div class=\"row\">\n    <span>If yes, date: <input type=\"text\" class=\"fill-line short\" data-field=\"iq320\"> / <input type=\"text\" class=\"fill-line short\" data-field=\"iq321\"></span>\n    <span>Hospital: <input type=\"text\" class=\"fill-line\" data-field=\"iq322\"></span>\n  </div>\n</section>\n\n<!-- DENTAL -->\n<section>\n  <h3>11. Dental History</h3>\n  <div class=\"q\">Date of last dental exam: <input type=\"text\" class=\"fill-line short\" data-field=\"iq323\"> / <input type=\"text\" class=\"fill-line short\" data-field=\"iq324\"></div>\n  <div class=\"q\"><span class=\"prompt\">Do you have dentures?</span><span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq325\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq326\"> Yes</span></span></div>\n  <div class=\"q\"><span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq327\"> Acceptable dentition</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq328\"> Unacceptable dentition</span></span></div>\n</section>\n\n<!-- FUNCTIONAL STATUS -->\n<section>\n  <h3>12. Functional Status <span class=\"note\">(check one)</span></h3>\n  <div class=\"q\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq329\"> No activity limitations</span></div>\n  <div class=\"q\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq330\"> Performs activities of daily living with assistance</span></div>\n  <div class=\"q\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq331\"> Unable to perform activities of daily living without total assistance</span></div>\n</section>\n\n<!-- CULTURE / ADVANCE DIRECTIVES -->\n<section>\n  <h3>13. Culture / Advance Directives</h3>\n  <div class=\"q\">What is your religious preference? <input type=\"text\" class=\"fill-line long\" data-field=\"iq332\"></div>\n  <div class=\"q\"><span class=\"prompt\">Do you have a living will?</span><span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq333\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq334\"> Yes</span></span></div>\n  <div class=\"q\">\n    <span class=\"prompt\">Have you chosen a power of attorney?</span>\n    <span class=\"opts\"><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq335\"> No</span><span class=\"opt\"><input type=\"checkbox\" class=\"box\" data-field=\"iq336\"> Yes \u2014 if so, name: <input type=\"text\" class=\"fill-line\" data-field=\"iq337\"></span></span>\n  </div>\n</section>\n\n<!-- FAMILY HISTORY -->\n<section>\n  <h3>14. Family History</h3>\n  <table>\n    <tr><th>Relationship</th><th>Kidney Disease</th><th>Hypertension</th><th>Diabetes</th><th>Cause of Death</th><th>Other Comment</th></tr>\n    <tr><td>Father</td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq338\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq339\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq340\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq341\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq342\"></td></tr>\n    <tr><td>Mother</td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq343\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq344\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq345\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq346\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq347\"></td></tr>\n    <tr><td rowspan=\"3\">Children</td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq348\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq349\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq350\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq351\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq352\"></td></tr>\n    <tr><td><input type=\"text\" class=\"cell-input\" data-field=\"iq353\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq354\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq355\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq356\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq357\"></td></tr>\n    <tr><td><input type=\"text\" class=\"cell-input\" data-field=\"iq358\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq359\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq360\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq361\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq362\"></td></tr>\n    <tr><td rowspan=\"3\">Siblings</td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq363\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq364\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq365\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq366\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq367\"></td></tr>\n    <tr><td><input type=\"text\" class=\"cell-input\" data-field=\"iq368\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq369\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq370\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq371\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq372\"></td></tr>\n    <tr><td><input type=\"text\" class=\"cell-input\" data-field=\"iq373\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq374\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq375\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq376\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq377\"></td></tr>\n    <tr><td>Other</td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq378\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq379\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq380\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq381\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq382\"></td></tr>\n    <tr><td>Other</td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq383\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq384\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq385\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq386\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq387\"></td></tr>\n  </table>\n</section>\n\n<!-- POTENTIAL DONOR CONTACT LIST -->\n<section>\n  <h3>Potential Donor Contact List</h3>\n  <p class=\"note\">Please list names, addresses and telephone numbers of all living relatives (mother, father, sisters, brothers, cousins, aunts, uncles and children over 18 years of age) and friends who may wish to be considered as a donor for you.</p>\n  <table>\n    <tr><th>Name and Address</th><th>Relationship</th><th>Telephone</th></tr>\n    <tr><td>1.&nbsp;</td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq388\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq389\"></td></tr>\n    <tr><td>2.&nbsp;</td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq390\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq391\"></td></tr>\n    <tr><td>3.&nbsp;</td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq392\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq393\"></td></tr>\n    <tr><td>4.&nbsp;</td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq394\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq395\"></td></tr>\n    <tr><td>5.&nbsp;</td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq396\"></td><td><input type=\"text\" class=\"cell-input\" data-field=\"iq397\"></td></tr>\n  </table>\n</section>\n\n<!-- DONOR INFO -->\n<section>\n  <h3>Who Can Be a Donor?</h3>\n  <p>A donor can be a family member, distant relative, friend, co-worker, or even someone who wants to give life to a person they do not know (\"altruistic donation\"). For kidney donation, while a blood-type match is ideal, blood-type incompatible transplants or kidney exchanges can be arranged for donor\u2013recipient pairs who are not compatible, including the possibility of a paired-exchange arrangement for a better-matched, longer-lasting transplant.</p>\n  <p>Living organ donation is a major surgery. While advances in transplantation, such as robotic surgical systems and 3D surgical planning, have minimized recovery time and improved outcomes, living donors must be in good health with no chronic medical or psychosocial disease.</p>\n\n  <h3 style=\"margin-top:16px;\">The Evaluation Process</h3>\n  <p>Each living donor is assigned a personal team of medical professionals, independent of the recipient's team, to ensure the donor's specific needs are met throughout the entire process.</p>\n  <p>Donor candidates will undergo an evaluation that includes blood tests, CT imaging, and surgical, dietary, psychosocial and anesthesia consultations. Additional tests such as cardiac evaluation may also be required.</p>\n  <p>For more information or to begin the donor questionnaire, please contact the transplant program coordinator:</p>\n  <div class=\"q\">Contact name: <input type=\"text\" class=\"fill-line\" data-field=\"iq398\"></div>\n  <div class=\"q\">Phone: <input type=\"text\" class=\"fill-line\" data-field=\"iq399\"></div>\n  <div class=\"q\">Email: <input type=\"text\" class=\"fill-line\" data-field=\"iq400\"></div>\n</section>\n\n<div class=\"signature-block\">\n  <div class=\"sig\">\n    <div class=\"fill-line long\"></div>\n    <p class=\"note\">Patient signature / Date</p>\n  </div>\n  <div class=\"sig\">\n    <div class=\"fill-line long\"></div>\n    <p class=\"note\">Physician / Coordinator signature / Date</p>\n  </div>\n</div>\n\n\n</div>";
const RECIPIENT_HISTORY_HTML = "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>\n<title>Recipient History &amp; Examination</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap\">\n<style>\n:root{\n  --bg:#F2F4F4; --surface:#FFFFFF; --surface-2:#E9EDED; --surface-3:#DFE5E4; --paper:#FBFAF7;\n  --ink:#14201F; --ink-2:#4C5D5C; --ink-3:#71817F;\n  --line:#D2DAD9; --line-2:#BDC8C7;\n  --accent:#0E6B70; --accent-soft:#DCEAEA;\n  --flag:#A9691F; --flag-soft:#F0E5D4; --stopc:#9E2A32; --okc:#1C7A4C;\n  --shadow:0 1px 2px rgba(20,32,31,.06), 0 8px 24px -16px rgba(20,32,31,.35);\n  --r:10px; color-scheme:light;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --bg:#0D1415; --surface:#141D1E; --surface-2:#1A2425; --surface-3:#222E2F; --paper:#161F20;\n    --ink:#E7EDEC; --ink-2:#9DADAC; --ink-3:#7C8C8B;\n    --line:#263233; --line-2:#33413F;\n    --accent:#54B4B8; --accent-soft:#123B3D;\n    --flag:#D9A45F; --flag-soft:#33260F; --stopc:#E3807B; --okc:#5FBB8B;\n    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.9);\n    color-scheme:dark;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#0D1415; --surface:#141D1E; --surface-2:#1A2425; --surface-3:#22
